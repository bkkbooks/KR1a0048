body:
  text: 周易總義卷六宋易祓撰上經隨兑上震下􅄲􅅀􅅀􅄲􅄲􅅀拘係孚于丈嘉夫小子小子丈夫隨之成卦震動于兑説之下以説而動為隨之象考卦爻之義而後見隂陽之情陽以健而行故三陽爻皆得所隨初言交有功四言有孚在道五言孚于嘉吉以其有所隨而無所係也陰以承陽為順故三隂爻皆未免有所係二言係小子則有丈夫之失三言係丈夫則有小子之失上言拘係以窮而變以其有所係而後隨者也知隨之義時則不必其有係無係而惟在得所隨之正上下皆惟正之隨是以六爻無貶辭其隨道之至者歟隨元亨利貞無咎彖曰隨剛來而下柔動而説隨大亨貞無咎而天下隨時隨時之義大矣哉王肅本作天下隨之又隨之時義大矣哉隨之卦體自否而變以上之陽剛而來居于初是謂剛而下柔合上下二體論之是謂此動而彼説大亨貞者所以釋元亨利貞之義蓋乾言四德純一不雜隨言四德而繼之以無咎則不能純乎乾之德無咎而已所謂無咎者六爻之義有正有不正舍其不正而皆歸于正所以無咎故隨以義為主義以時為主此隨之時義所以為大也象曰澤中有雷隨君子以嚮晦入宴息震為雷兑為澤兑正秋也正秋之時雷乃收聲則息而入于澤中為蟄藏之始君子以之嚮晦入宴息隨時之義也初九官有渝貞吉出門交有功象曰官有渝從正吉也出門交有功不失也官守也渝變也初九當位何言乎變當隨之世諸爻皆以從五為正而五逺于初四非正應焉未可以隨當自守而已然震動之始不可拘于自守苟從于正則無惡于變故曰官有渝貞吉所謂貞吉者四雖非應而居相應之地且與二三互艮為門二三陰柔非所當隨惟四與五相孚而五能明其功出門而交有功是則因四而達于五也是謂從正而不失其所隨者也六二係小子失丈夫象曰係小子弗兼與也六二與九五為正應各當其位隨于五可也但二隂居陰位而柔之為道不利逺未免以近比者為係矣既係乎三之陰必失乎初之陽以喜而隨人者豈可以兼與乎蓋陽為丈夫隂為小子是係小子必失丈夫也惟其居中得正終應乎五是以雖失而不至于凶咎也六三係丈夫失小子隨有求得利居貞象曰係丈夫志舍下也六二之隂故言係小子則失初之丈夫三近于九四之陽故言係丈夫則失二之小子矣二猶隂柔中正而三則隂柔失位惟其在震體之上固巳離于二矣失二則志已舍下係四則有求有得所謂得者如初之以從正為貞故言利居貞以貞處之亦以從五為正如是而得無惡于求也九四隨有獲貞凶有孚在道以明何咎象曰隨有獲其義凶也有孚在道明功也下三爻上隨而四居其前以陽剛乘之與五同德在隨之義則為有獲然而五君也四臣也下之隨乎上當使恩威出乎上則所獲為得其正四近君為多懼之地若使人心隨已則有逼上之嫌雖以正處之其義亦凶然則如之何蓋履天下之至危而成天下之大功惟以道事者能之修吾胸中之誠而無一毫私意之纍所以有獲者為吾君而獲也吾何有焉此所以動容周旋皆與道俱且有功而君不疑五能明其功則君臣之間至誠相與有孚在道以明何咎此所以為無咎也九五孚于嘉吉象曰孚于嘉吉位正中也嘉者善也五言孚而不言隨者上無隨下之義也五與二相孚故曰孚于嘉先儒謂嘉耦曰配二五中正而應者巳孚于嘉者亦惟善是從而已蓋當隨之世五之所孚者雖止于二然好善優于天下而五爻皆得所隨使天下之人皆以善相孚此隨道之至盛者也上六拘係之乃從維之王用亨于西山象曰拘係之上窮也左氏傳卜偃所言享字文公從其説謂古者享獻之享皆作亨此當讀亨為享隨之上六隨之窮者也凡易之言窮者皆謂其當變若其未變則拘係之乃從維之然而人心之變有不可禦者若當變而善九五正位有王用享于西山之象蓋兑之上體為西方或謂西山為周之岐山王為周之太王皆非其義易言王用者皆非有所指之耳王用以享則禮行于變通之後此隨道之所以為不窮也蠱艮上巽下􅅀􅄲􅄲􅅀􅅀􅄲髙尚用譽裕父幹父幹母幹父蠱蠱蠱蠱蠱之成卦巽順于下而艮止乎上上下蠱弊為蠱之象蠱非一日之積也是以飭蠱之道貴乎剛柔之相濟初六幹父之蠱六五幹蠱用譽隂居陽位以柔而濟乎剛者也九二幹母之蠱上九不言蠱而言髙尚其事陽居隂位以剛而濟乎柔者也必不得已而去則寧過于剛而不可過于柔九三晦而無咎則過剛猶足以幹蠱六四以往而見吝則過柔反以裕其蠱也必有二五之中德而後剛柔相濟皆得其正君子之飭蠱亦必有道矣蠱元亨利涉大川先甲三日後甲三日彖曰蠱剛上而柔下巽而止蠱蠱元亨而天下治也利涉大川往有事也先甲三日後甲三日終則有始天行也蠱自泰變以初九之剛而往為上九以上六之柔而來為初六剛上而柔下以成艮巽之體巽順也艮止也下巽則不立上止則不為治生安安生偷而後蠧弊之端起此所以飭蠱者必有取乎元亨之義元亨者于元處亨也如器雖蠧壞而其朴猶存取器之朴而更新之是謂元亨蠱元亨而天下治蓋取諸此考之卦體下乘巽木有利涉之象上為艮體有成終成始之義甲者旬之首先甲三日以謹其始後甲三日以圖其終始而終終而始天行也體天行以治蠱則蠱復于泰矣象曰山下有風蠱君子以振民育德山在上而生養萬物育德也風在下而鼓動萬物振民也育德者長之使不窮振民者作之使不偷是二者皆治蠱之道也先振民後育德者卦體之序有然也初六幹父之蠱有子考無咎厲終吉象曰幹父之蠱意承考也蠱者蓋非一日之積也君臣父子皆有飭蠱之道惟非一日之積必以世而後見故諸爻以父子發其義初在下為人之子則言幹父之蠱蠱卦本泰卦之變泰之下卦乾體為父初之剛上則父已往矣父往為考而前日蠧壞之弊猶有存者初能幹父之蠱是為有子所謂意承考者革前人之蠧弊不能無所損益損其過者益其不及者亦前人之意初能承其意而不承其事其弊既革考亦可以無咎然初以柔體未必能盡保終之道若能以敬惕自處所以厲而終得吉也九二幹母之蠱不可貞象曰幹母之蠱得中道也諸爻言父而此獨言母者蠱本泰體上卦之坤為母五以柔居尊位而二為正應故言幹母之蠱凡事之道貴乎巽而順二以陽剛應五故戒之以不可貞貞則矯拂而不安其傷恩實多矣惟六五與九二兩爻剛柔相濟皆得中道剛不強柔不懦此恩義所以為兩全也九三幹父之蠱小有悔無大咎象曰幹父之蠱終無咎也九三陽居陽位過于剛者也事父之道過剛則非順惟剛而得正乃父之諍子夫子論爭子則曰故當不義則諍之其義以正救為先然正而不中亦未盡善故幹蠱之時以過剛行之雖未免于小有悔而亦可以無大咎故又曰終無咎也六四裕父之蠱往見吝象曰裕父之蠱往未得也六四隂柔不中非幹蠱之才而過于順從父之令安得為孝故為裕父之蠱裕者益也當是時不能幹而又從增益之何往而有成六五亦隂柔在上往必見吝故其戒如此六五幹父之蠱用譽象曰幹父用譽承以德也六五幹蠱之主當蠱之世以柔順在上其才若不足而爻言幹父之蠱者是不以才幹而以德幹者也蓋六五柔中之德資九二剛中之應剛柔相濟成德益著是能以令德之譽而承前人之蠱如髙宗致嘉靖之治宣王成修攘之烈凡前人所未備者無非承之以德而增益其美所以得用譽之道譽者德之賔也在乎善用之而已上九不事王侯髙尚其事象曰不事王侯志可則也前五爻皆言蠱上獨不言蠱者蠱道已飭無事乎幹也上焉伊尹周公下焉范蠡張良能保成功于不當事之時故言不事王侯髙尚其事髙尚者往往失于索隱行怪不可為則于天下惟上九艮體得止于其可止之義其志可則正為臣之道前四爻亦臣道也不言臣者臣子一而已臨坤上兑下􅄲􅄲􅄲􅄲􅅀􅅀孰臨知臨至臨甘臨咸臨咸臨臨之成卦兑在下坤在上卦以二陽為主而二陽在四隂之下何取乎臨而謂之咸也咸者感也感乎正應以為臨而已蓋臨卦繼乎復卦之後初陽方復未可遽進志于行正所以咸臨貞吉也二陽方進而四隂猶未委順以中而應所以咸臨吉無不利也三則不中不正而居兑體以甘言為説二陽因之而進所以甘臨無咎也陽進于三則卦為泰體四應初而得坤體之至故曰至臨也五應二而為中行之君故曰知臨也上居終而為坤體之成故曰敦臨也此臨終為泰勢所必至然泰至上而吝臨至上而吉者臨方進而未極故也臨元亨利貞至于八月有凶彖曰臨剛浸而長説而順剛中而應大亨以正天之道也至于八月有凶消不久也臨卦之二陽在下君子道長之漸也剛浸而長指初九九二言也説而順指內外二卦言也剛中而應指九二六五言也大亨以正者所以釋元亨利貞之義蓋乾言四德純一不雜臨言四德而繼之以八月有凶則不能純乎乾之德大亨以正天之道而已所謂天之道者乃隂陽消長一往一來循環不窮也二陽為臨以正而亨未至于凶乃著八月有凶之戒此天道之必然者何謂八月周之八月為遁卦又自臨卦至否卦几有八月二者皆陽消隂長之漸夫剛長之時而謂之消不久者是聖人為君子慮蓋甚深且切也象曰澤上有地臨君子以教思無窮容保民無疆澤以臨水地又臨澤為臨之象也蓋下卦兑體以朋友講習為教而教思無窮者則兑澤之無窮也上卦坤體以厚德載物為容而容保民無疆則坤載之無疆也教而思之容而保之以此臨民其無所不臨者哉初九咸臨貞吉象曰咸臨貞吉志行正也咸感也以陽感隂故曰咸臨夫當臨之時四隂在上而初以陽剛進于下正咸感之義也然陽剛之德其實兑體上行之始豈遽以兑説感人哉位在陽先感之亦必有道初九之位既正而六四之應亦正志于行正可也聖人為君子慮懼其或進而所感非其道必使之固守其正故曰貞吉九二咸臨吉無不利象曰咸臨無不利未順命也二爻與初爻皆以陽感隂故皆曰咸臨也初主于貞未可有行二主于中善用臨者也蓋二陽浸長而四隂在上其𫝑方盛未能委順故曰未順命也所謂未順命者臨終為泰勢所必至特未恃之而已惟與六五之柔中為正應上下以中相與不特有致吉之道推而行之天下無所不利也此二陽之所以浸長而不已者也六三甘臨無攸利既憂之無咎象曰甘臨位不當也既憂之咎不長也三為下卦兑體之主位既不當而二陽上進乃以兑説之體甘言以説乎下君子説之不以道不説也如之何而以甘言説人哉即上下互卦求之兼震動坤順之體以順為説故甘臨無攸利以動而恐故既憂之無咎象贊之曰咎不長也至是而為乾體則二陽為之偕進矣六四至臨無咎象曰至臨無咎位當也三為兑體至四為泰而四即泰之坤位坤以至哉為元故曰至臨者六四以隂柔在上而得其正初九以陽剛在下而亦得其正初以正而感四以正而應此至臨所以無咎四與三皆言無咎而難易不同者三不當位而四當位故也六五知臨大君之宜吉象曰大君之宜行中之謂也夫五爻以柔中在上而爻曰知臨大君之宜象曰行中何謂也中者五之德也五者大君之謂也此六五全為泰體泰體之六五以中德居尊位與九二之剛中相應故二爻以包荒用馮河不遐遺朋亡而得尚于中行之君此六五亦以柔中主之九二亦以剛中應之其終至于二陽上行四與上亦皆以正而近比于五是能兼衆人之知以為知而其知足以有臨此知臨所以為大君之宜宜其吉也上六敦臨吉無咎象曰敦臨之吉志在內也上六居臨之極地而無應于下非能臨之者而亦謂敦臨何也蓋敦者厚也坤之德至上而益厚故也夫上三爻皆泰體然泰卦至上何以為否上行之極則否而巳臨卦之上六得坤體之厚以從陽為慶而志在于內是以不為否而為泰考六爻之義初與二五皆言吉二與四皆言無咎惟上六志在于內言其隂柔者則得六三之無咎言其從陽者則得初與二之吉爻辭兼是二義而象獨以為敦臨之吉則其從陽可知也觀巽上坤下􅅀􅅀􅄲􅄲􅄲􅄲觀其觀生民觀國觀我窺光生觀童觀觀之成卦坤卦居下巽卦居上與臨卦為反對臨之二陽在下進于三則成泰卦觀之四隂在下進于五則成剝卦惟九五以中正觀天下下觀而化也則天下皆為君子之歸故四隂以近于陽爻而有善不善存焉初以小人之道為童觀是則冥然無所見也二以利女貞為窺觀是則有所見而未大也三觀我生而有進退之義也至四觀國光而全用賔之道也至五以觀民為大觀之主也上以觀其生而驗觀民之效也然後四隂得以觀感而化故二爻言君子無咎而天下皆君子則亦奚至于剝此有孚顒若下觀而化大觀之世也觀盥而不薦有孚顒若彖曰大觀在上順而巽中正以觀天下觀盥而不薦有孚顒若下觀而化也觀天之神道而四時不忒聖人以神道設教而天下服矣前四觀字去聲後兩觀字平聲觀卦之二陽在上下之所觀仰所以為觀也大觀在上指二陽爻言之也巽而順指內外二卦言之也中正以觀天下指九五爻居中正之位下觀四隂而言之也有孚顒若下觀而化即盥而不薦之義也蓋聖人非輕薦而重盥也盥者祭之始方其鬱鬯祼地盥手于洗則祭事為未舉薦者祭之盛祝延尸于堂朝薦獻腥饋食獻熟則祭事為已備所謂下觀而化者蓋不孚于已事之後而孚于未事之始者也不言而信不令而威雲行雨施而天下平上下皆不期其然而自孚之所以謂之神道是非于神道之外而别有所謂觀也故曰觀天之神道而四時不忒聖人以神道設教而天下服矣此聖人之教無非天道觀之所以為觀也象曰風行地上觀先王以省方觀民設教風行地上則地之長養萬物鼓之以風者則天也故天之動物以風而聖人之動民則以言方與民則以坤之地而言設教則以巽之風而言省方觀民則以風行地上而言民俗之剛柔緩急不同而其設教以動民則一而已古之三載一巡狩而觀風考禮一本諸此初六童觀小人無咎君子吝象曰初六童觀小人道也朱文公曰觀以觀示為義據九五為主也爻以觀瞻為義皆觀乎九五也觀之所以為觀者二陽在上下觀而化也初最在下以六居之實逺于陽以是為觀蓋童子之觀者也故曰童觀小人道也小人當大觀之世不知帝力之何有于我耕田鑿井而已故無咎君子處之而不著不察則可小矣所以為吝六二窺觀利女貞象曰窺觀女貞亦可醜也六二正處內卦為坤體有闔户之象乂三互艮卦在門闕之內故曰窺觀然大觀之世上有九五而二為之應實中正以觀天下之助而乃有窺觀利女貞之戒者何也蓋觀之為義以去陽之逺近為善否二雖隂柔得位而去五為尚逺不能見剛中之道是女子之貞而已矣故以女子居之則為利以君子居之則醜也六三觀我生進退象曰觀我生進退未失道也蓋大觀之世諸爻皆觀乎陽者也初與二去陽為甚逺所觀皆未大至于三爻則漸近于陽若非小人之觀矣然而位不中不正在下卦之上上卦之下進退莫適所主未盡下觀而化之道故曰觀我生進退也謂或進或退觀我之生而已矣吾者指五也生者即五之施為動作也凡易之稱我者若需卦若解卦若井卦若鼎卦若旅卦固以本爻為主至論其全卦之義則以主爻為我蒙卦之九二小畜卦之六四頤卦之上九是也是知觀卦之六三爻言我者即全卦所主之九五爻也蓋觀之為卦本君子道消小人道長之漸若使四隂並進其終必至于剝而後已耳惟九五之爻陽剛中正未為失道四隂皆下觀而化之為大觀之主此六三爻之觀我生進退亦所觀之正者也六四觀國之光利用賓于王象曰觀國之光尚賔也觀至于四四隂方盛𫝑與五敵進退不已其終必至于剝惟九五之主大觀在上以中正觀天下未失君道四最近而居正又為巽之體以巽體居近君之地是以得君為最親故言觀國之光利用賓于王蓋古之人重賔禮坐賔于西北之方主人接以仁厚之氣故坐于東南以行答賓之禮四以巽體居東南之位而言利用賓者以主人言之故象辭以為尚賓尚者上也言為王所尚也觀至六四為全美其大觀之君子歟九五觀我生君子無咎象曰觀我生觀民也九五以陽剛居尊位中正以觀天下為四隂之主故四隂進退于下其利害休戚皆係于吾身故曰觀我生則以本爻之所主者言之故象釋之以觀我生觀民也民謂自四以下皆是也且觀民何與于觀我乎中庸王天下之章有曰本諸身徵諸庶民蓋觀民以察已之道使其在我者施為動作無一不善然後可以言君子無咎則亦先觀乎我而已此九五之顒然在上而四隂皆相孚于下有孚顒若謂之大觀然歟非歟上九觀其生君子無咎象曰觀其生志未平也上者五之終也五之觀我者所以觀民至上而後可以驗觀道之成于是復觀其生夫觀其生者觀彼之生而使在彼者皆為君子皆由中正之道則在我足以遂其志苟有一之未善則在我不能遽忘乎天下是以其志有所未平然則何以處之也必以中正之道率先天下至于人人皆有士君子之行則九五觀民之效於此可見此九五與上九所以皆言君子無咎周易總義卷六
