body:
  text: 御題易祓周易總義八韻長沙撰總義觀象玩辭符總貫諸家解義通十翼扶人心即天地易理示規模多辨原成躁求精反涉粗彼非謂此是喜合率攻殊略覽草卷有頗嘉各弊無發明尚平正流布未𢎞敷設曰不言好安能槩置乎欽定四庫全書經部一周易總義易類提要臣等謹案周易總義二十卷宋易祓撰南宋館閣續録載祓字彥章潭州寧鄉人淳熙十一年上舍釋褐出身慶元六年八月除著作郎九月知江州周密齊東野語則載其諂事蘇師旦由司業躐擢左司諫師旦敗後貶死蓋館閣續録但記其入院出院之事密所記則其究竟也祓人不足重其書世亦不甚傳故朱彞尊經義考注曰未見然其説易兼通理數折衷衆説每卦先括為總論復於六爻之下各為詮解於經義實多所發明與耿南仲之新講義均未可以人廢言也前有祓門人陳章序稱祓侍經筵日嘗以是經進講又稱祓别有易學舉隅四卷裒象與數為之圖説與此書可以參考今未見傳本惟所撰周禮總義尚散見永樂大典中耳樂雷發有謁山齋詩曰淳熙人物到嘉熙聽説山齋亦白髭細嚼梅花讀總義只應姬老是相知蓋指此二書山齋祓别號也則當時亦頗重其書矣乾隆四十六年四月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀周易總義序易以總義名者總卦爻之義而為之説也昔者聖人作易得於仰觀俯察者八卦之畫而已後有聖人者作重之以爻係之以辭貫天理于人事之中而後知有顯必有微有體必有用惟能識義理之總會然後卦爻之指歸可得而明也山齋易公先生蚤嵗讀易講明是理久矣嘗舉大綱以示學者曰大易者元氣之管轄也聖人者大易之權衡也先生之學其梗概見於乾坤蓋一隂一陽之謂道乾則自元而至於貞坤則自元而反於元此天道所以流行而不息先生於二卦首發是理然則濂溪周子所謂元亨誠之通利貞誠之復者先生固已默會之矣元亨利貞至理無妄五性于是乎始萬善于是乎出天下之事于是乎標凖易之六十四卦皆是物也先生侍經筵日嘗以是經進講燕居之暇復取是而研究之閲二十餘年優柔厭飫渙然氷釋于是略訓詁明大義合諸家之異而歸之于一每卦各列爻義總為一説標于卦首欲其倫類貫通而學者有所考明焉既又為舉隅四卷裒象與數為之圖説蓋與此書可以參考云紹定戊子夏四月旦門人陳章謹序
