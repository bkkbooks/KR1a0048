body:
  text: 周易總義卷十一宋易祓撰下經明夷坤上離下􅄲􅄲􅄲􅅀􅄲􅅀登天利貞入于南左腹狩夷于明夷左股于飛明夷之成卦離下坤上夷傷也言聖賢遭時之昏暗而闕傷其明也是以上卦主紂而下卦乃文王事初之明夷于飛垂其翼則言羑里之難二之用拯馬壯吉則言濟難之急三之明夷于南狩得志則言以明事君之義下三爻闕茍有以扶其傷則猶可復其明自四闕體以傷人之明者四言入于左腹則闕其志五言箕子利貞則君子不能安其闕後列紂之位當是時也有箕子以保護闕正救于外或者其庶幾乎而紂惡日甚闕獨夫卒底于亂明夷之極也聖賢闕明夷利艱貞彖曰明入地中明夷內文明而外柔順以蒙大難文王以之利艱貞晦其明也內難而能正其志箕子以之闕明也聖賢處明夷之世固守其志而不闕所守故卦辭曰利艱貞而已彖辭乃以闕義文王得一卦之用而以離明處坤闕釋卦義故曰內文明而外柔順以蒙大難闕一爻之義而善處六五明夷之世彖闕故曰利艱貞晦其明內難而能正其志闕二四為坎坎險為難于文王則曰大難于箕子則曰內難各因其所處之位而皆能全其所闕處明夷之世而用晦以免難不足以知闕象曰明入地中明夷君子以蒞衆用晦而明闕衆也用晦而明者離明之不息者也明入地中其闕雖傷然浴于咸池入于昆吾而復升于扶桑豈終闕君子處之未嘗無不可用之道用之蒞衆者闕明自坤而離也初九明夷于飛垂其翼君子于行三日不食有攸往主人有言象曰君子于行義不食也闕文王之事也彖辭言內文明者是已明闕髙飛則弋人何慕焉然君子不能遽闕垂翼則有繳而射之者矣豈離為飛闕不食歷離之三爻為三日互震在闕君子于行則言其往而囚于羑里三日闕聖人何憂哉象以義不食言之則憂闕憂天下之義如是而往主人有言而闕蒙難之極者也六二明夷于左股用拯馬壯吉象曰六二之吉順以則也闕羑里者也所謂夷于左股者股在下闕右尤切于左夷于左股則傷猶未深闕位思所以拯之之道故曰用拯馬壯吉闕拯而出也壯健也指所比之三也蓋下闕義三為互坎中位坎為美脊亟心之闕馬壯之象二比于三三自上拯之以闕庶幾反昏為明其體至順乃為萬世闕以為吉也九三明夷于南狩得其大首不可疾貞象曰南狩之志乃大得也闕也狩者以明而行也大首君之象也九三以剛居剛又在明體之上而屈于至暗之下正而當位與上為應有欲正救其君之惡而復向于明闕可疾過于疾則亂惟處之以正使之闕已此在文王之志所以大得以明免闕六四入于左腹獲明夷之心于出門庭象曰入于左腹獲心意也闕之君子上卦坤體為至暗之地六闕上六暗主同德必不以正而合如崇闕惡來之徒極其姦邪以蠱惑君心至此闕言入于左腹腹者至隱之地也左猶左闕正之道探人主之隱微以售其深闕獲明夷之心所謂獲明夷之日于出門闕播于外小人情狀可畏也已六五箕子之明夷利貞象曰箕子之貞明不可息也闕獨不正其位何也紂為不道天下無闕遂為虛位當時所謂三仁者比干死諫而身不免微子去之以存宗祀惟箕子以宗臣獲闕徉彺為奴其明雖夷惟利乎貞以貞處闕滅而明不可息特著箕子于六五之闕此正明夷利艱貞之事言其當紂之世處內難而能正其志也上六不明晦初登于天後入于地象曰初登于天照四國也後入于地失則也闕明而晦紂之事也紂之初履天闕國之象及為淫邪昏惑則反入于地闕法也國與天地並而與有立者法也闕故不列于五而列于上爻無位之地闕厥命明夷之禍極矣家人巽上離下􅅀􅅀􅄲􅅀􅄲􅅀有孚有家富家家人中嗃嗃饋間有家家人之成卦離下巽上闕家人利女貞彖曰家人女正位乎內男正位乎外男女正天地之大義也家人有嚴君焉父母之謂也父父子子兄兄弟弟夫夫婦婦而家道正正家而天下定矣闕女居闕字而已闕四而在闕正家之本故闕謂九五也二五闕大義也舜之刑于二女釐降二女于媯汭闕而不切于事情者及觀殷周之褒妲漢唐闕武然後知袵席之禍慘闕家道必貴于嚴父闕曰父父子子闕天下定觀闕象曰風自火出家人君子以言有物而行有恆闕初九間有家悔亡象曰間有家志未變也闕六二無攸遂在中饋貞吉象曰六二之吉順以巽也闕正位乎闕遂者春秋傳曰闕專也况於女子乎使遂其闕之道故曰無攸遂在中饋貞吉闕奉一以順巽處之此外毫無闕貞吉九三家人嗃嗃悔厲吉婦子嘻嘻終吝象曰家人嗃嗃未失也婦子嘻嘻失家節也三言家人者家人有嚴君者也婦子者聽命于家人者也家人以嚴君為主嚴而不違乎禮法故曰嗃嗃嗃嗃尚嚴之貌過乎嚴而至于傷恩拂情故曰嘻嘻嘻嘻嗟怨之辭嘻嘻之義闕明以笑樂訓之者非詩言嘻嘻闕傳言陽貨從者嘻之類皆不闕嘻乃嗃嗃之過于嚴者三之重剛闕以二義發明之謂嗃闕而吉嘻嘻則婦子嗟怨闕異也六四富家大吉象曰富家大吉順在位也易以陽道常饒為富四重隂而謂之富家者上比九五居近君之位有家以為富者也周室班祿公以大都之田任疆地卿以小都之田任縣地大夫以家邑之田任闕地有地則有家非以順處人則富者怨之府所以保闕體居闕順之至者也以順在位所以闕吉闕九五王假有家勿恤吉象曰王假有家交相愛也假至也九五陽剛中正闕內外交相親愛正家之道莫此為闕豈惟家哉家人者一家之所親人君闕以至尊行至家而視天下如一家視一身如家人闕以王化之基行于交相愛之中雖勿恤乎天下之莫我親而父父子子兄兄弟弟夫夫婦婦推之天下不勞而治此勿恤所以為吉也上九有孚威如終吉象曰威如之吉反身之謂也上者家道之成也卦之全體于二四之隂柔得正故象辭皆言順若初與三五則皆以陽剛為正家之本至上九而後謂之有孚威如且威如何取于有孚哉以家道責乎人而在我不能反諸身則其𫝑必有所不行何者無相孚之素而已惟反求其在我而我身無一毫之愧以此率乎人則人心相孚不期而自威家道大成終吉之謂也睽離上兑下􅅀􅄲􅅀􅄲􅅀􅅀羣疑悔亡亡遇元無初遇主悔夫有終于巷亡睽之成卦兊居下離居上以乾坤交索而成體未嘗不合也惟火澤相違所以為睽耳以卦體觀之初九爻九二爻居下卦之下九四爻六五爻居上卦之下不為卦首各隨所處故四爻之義皆曰無咎蓋以離兊相逺不見其為譎且怪也至六三爻居兊體之上上與離接則見離之異上九爻居離體之上下與兊應則見兊之異是以譎怪雜出而皆非其所常見者也始而所見各異斯謂之睽終而其事同也其志通也則睽亦未嘗不合矣詳離與兊之體則睽之義了明矣睽小事吉彖曰睽火動而上澤動而下二女同居其志不同行説而利乎明柔進而上行得中而應乎剛是以小事吉天地睽而其事同也男女睽而其志通也萬物睽而其事類也睽之時用大矣哉睽異也火動而上澤動而下上下相反乃中少二女之卦有同居不同行之志所以為睽以卦德言之則兊以説而麗乎離之明以卦變言之則柔進而上行四五爻相易乃中孚卦之變也于是五以柔中在上而應乎剛中之九二睽之異者若可以合而剛在柔下故卦辭特曰小事吉也然睽之為義雖以小事吉而其用實大得時用之宜則天以氣交而其事同男女以情感而其志通萬物以族列而其類有時而可用則皆所以合天下之異此睽之時用所以為大也象曰上火下澤睽君子以同而異火澤合而成卦未嘗不同也火在上而澤在下亦未嘗不同也蓋天下之物或相什百或相千萬或相倍蓰比而同之是謂茍同能無枉道而徇人者乎惟和而不同周而不比羣而不黨即君子以同而異之義也異以立已同以接物亦二女同居不同行之意也乎初九悔亡喪馬勿逐自復見惡人無咎象曰見惡人以辟咎也初以陽剛動于下正也無應于四宜若有悔而云悔亡者未涉于悔而已四互坎為馬睽孤在上而不相應故云喪馬然四之前後三五皆隂類不可相與惟同類之求舍初將安之乎是以有喪馬勿逐自復之象復者同類而復四雖同類而坎險不正其義為惡人若棄而絶之反以立敵辟其咎而至于無咎所謂君子以同而異也九二遇主于巷無咎象曰遇主于巷未失道也二爻與五爻亦非正也而三四爻阻之所以為睽惟其得中正應相求故不言睽而言遇主于巷巷雖非正而通諸道即孔孟子之所謂權則權非反經泛應曲當皆不違乎正于道未失何咎之有也所謂時用者如此耳六三見輿曳其牛掣其人天且劓無初有終象曰見輿曳位不當也無初有終遇剛也馬虞云剠鑿其額曰天針因反三爻與上爻正應也惟其失位不正皆過乎中當睽之時睽久必疑上之所以疑乎三者以二陽間乎上下所見乖異非睽之甚者乎蓋互坎則剛動在前坎為弓輪為輿曳互離則剛動在後離為牝牛為牛掣兊毁折為剠為劓三為上所疑者如此是謂無初疑極必通而象辭以為遇剛蓋上之陽剛終與三相應睽而必合有終也九四睽孤遇元夫交孚厲無咎象曰交孚無咎志行也四爻無應於初者也而前後三爻五爻皆柔孤立無朋是謂睽孤當睽孤之時初正而四不正以四爻為惡人而避其咎何以行志也惟四爻以同類相合不期而遇故曰遇元夫謂陽剛為夫在初爻為元誠意交孚化厲為安其志得行是以無咎也此反睽所以為同也六五悔亡厥宗噬膚往何咎象曰厥宗噬膚往有慶也五爻與二爻正應也而位不得其正當睽之世為三四所阻能無悔乎惟剛柔皆中是以悔亡厥宗謂二也同人之二應五亦曰同人于宗是已今二以五為宗相應二兊體為口又自二至上有噬嗑之象乃能噬三四而進焉若噬柔脆之膚然後能往與五合爻言往何咎而象言往有慶君臣相得為慶此睽之所以為通也上九睽孤見豕負塗載鬼一車先張之弧後説之弧匪寇婚媾往遇雨則吉象曰遇雨之吉羣疑亡也上爻與三爻正應也與四爻為不同四無應于初是謂睽孤上有應于三而亦曰睽孤者謂三爻為二陽所制而上三爻皆非其正上處睽極之地未免乖離亦以孤言之也當是之時見豕負塗載鬼一車以無為有其疑益熾蓋互坎為豕為鬼為匪寇婚媾為遇雨皆具是象然疑極必反未有終見疑于上者先見其張弧疑三之射已也後見其説弧乃三之釋其疑也是張弧者非為寇而害已説弧者乃為婚媾而親已三與上相親羣疑盡亡是謂隂陽和而雨往遇雨而言吉則睽極而合又非前爻所謂遇主與遇元夫之比也蹇坎上艮下􅄲􅅀􅄲􅅀􅄲􅄲來碩大蹇來連來反蹇蹇來譽蹇之成卦艮下坎上遇險而止止者不可往往則蹇也蹇之為義豈終于不可往耶若水在山盈科而進不一于止故六爻之義係于往來者四不係于往來者二二爻曰王臣蹇蹇五爻曰大蹇朋來而不致往來之辭以二爻得中故也初曰往蹇來譽三曰往蹇來反四曰往蹇來連上曰往蹇來碩其義皆以往為失而來為得以四爻非中故也處蹇之道亦戒乎不中而已二五中正君臣道合自足以止天下之蹇蹇之所以言利者如此蹇利西南不利東北利見大人貞吉彖曰蹇難也險在前也見險而能止知矣哉蹇利西南往得中也不利東北其道窮也利見大人往有功也當位貞吉以正邦也蹇之時用大矣哉蹇之為言難也不言難而言蹇者坎險在上艮止于下止而不往未能濟險為蹇之象也且見險而能止彖辭何以稱其知蓋天下之理未有終止而不往者特在乎利與不利而已蹇之所以利西南不利東北者東北艮位西南坤位卦本無坤體乾三索于坤而得艮今六二尚往而易五則由東北之艮位而獲歸西南之坤位以濟險之道利順不利止也惟其順而往此西南所以得九五之中惟其止而不往此東北所以為道之窮也處蹇之君子取其利者而去其不利者謂濟天下之險必利見九五之大人既得其中二三四上皆當其位而貞吉以此為知于正邦也何有此乃時用之所以為大而君子所以能用其大者也象曰山上有水蹇君子以反身修德山上有水蹇也盈科而後進則反乎山之下乃水性之本然故蹇之諸爻皆以往為失而以來為得來者反于內即自反之道君子以之反身修德所以濟天下之蹇者也初六往蹇來譽象曰往蹇來譽宜待也鄭康成作宜待時也蹇之諸爻不喜往而卦彖言往者總全卦言之二往西南為得中利見九五之大人往則有功二者皆出坎之象諸爻往則入坎故皆以往為戒初在下無位而上無正應往必遇坎為蹇宜退以待則可以有譽譽本于德反身修德而譽隨之然內卦之初何以言來來往相反之辭以不往為來而已所以謂之來譽也六二王臣蹇蹇匪躬之故象曰王臣蹇蹇終無尤也以六居二人臣之正位也去坎險雖逺而上卦為坎自二至四為互坎蹇蹇之象所謂蹇蹇者乃天下之蹇非一身之蹇故曰匪躬之故人臣不以匪躬之故而遂忘天下于是出而濟難上輔為五謂之王臣當是之時五以剛健為處健之君二以柔順為處險之臣君臣正應中正相與以是任天下之重雖處重蹇而舉天下終無尤我亦何難之不濟此爻辭不言往蹇得濟蹇之道者也九三往蹇來反象曰往蹇來反內喜之也三爻居艮體之上止之極也止極則陽性上往正接坎險故戒以往蹇而欲其來反于內反如魯之季子來歸春秋嘉之故言內喜內喜者三以重剛為內卦之主二在其下初又在其下皆隂柔之才故欲其來來則反諸內而為二隂之捍蔽此二隂處坎險之下而喜其得所依者也六四往蹇來連象曰往蹇來連當位實也四爻比五爻為近君之位而以隂柔居坎險之下未可遽往故曰往蹇所幸入坎未深且不比于三以九處三亦為當位所謂當位而實則陽剛為實獨言九三而已三居下卦之上與初爻二爻上行故曰來連連則同出險難而皆比于五者也九五大蹇朋來象曰大蹇朋來以中節也卦之六爻皆蹇也九五爻以陽剛居尊位正陷于坎險之中大蹇之象也或謂五爻與二爻為正應即朋來之助然朋者類也六二爻非陽剛不得為朋惟九五爻能以中道為節于天下是以九三爻不約而來反于內而為二隂所喜又外應上六爻而與六四爻牽連以進與之共輔九五以濟天下之難故曰大蹇朋來朋來與諸爻言來不同以九五為尊所以自下而言來也上六往蹇來碩吉利見大人象曰往蹇來碩志在內也利見大人以從貴也上六爻居蹇之極無所謂往也往亦不出乎坎故曰往蹇不往而來志在內卦之九三爻三以陽剛應之碩也碩大也陽也剝上爻之碩果是也陽剛相應于成卦之上所以獨謂之吉至是而後利見大人大人其九五朋來之主乎彖言利見大人泛指諸爻言之奚獨上六惟上六志在于內因九三利見九五五以陽剛為貴從貴以濟難蓋聖人于上六之成卦而極言之也解震上坎下􅄲􅄲􅅀􅄲􅅀􅄲無不有利孚朋孚貞吝貞吉無咎解之成卦坎為下卦震為上卦震動于坎險之外險難已散所以為解方其未解也坎在下卦以險為難而險難之最甚者惟六三爻而已故曰負且乘致寇至若初爻言無咎九四爻言解而拇所以解其難而相應于各卦之下者也九二爻言田獲三狐得黃矢六五爻言君子維有解所以解其難而相應于各卦之中者也至上六爻與六三爻不相應而言射隼于髙墉之上是謂解悖所以居解之終也然以爻論之惟九二爻六五爻以得中而皆吉論一卦之全體則往來無一之不吉此所以君子之善處解者有然也解利西南無所往其來復吉有攸往夙吉彖曰解險以動動而免乎險解解利西南往得衆也其來復吉乃得中也有攸往夙吉往有功也天地解而雷雨作雷雨作而百果草木皆甲拆解之時大矣哉解難之散也下險而上動動而免乎險故險難散而為解之象也蓋解者蹇之反蹇卦以六二爻往九五爻為坤為中故言蹇利西南往得中也解卦以初六爻往九四爻為坤為衆故言解利西南往得衆也其來復吉者下卦之坎也有攸往夙吉者上卦之震也方其在坎險而無所往故來復于中而吉以其陽剛在坎之中宜于復也及其出而之震則可以有所往故動宜早而往有功以其陽剛在震之初宜于動也其未解而來復即蹇之所以為來反其既解而有功即蹇之所謂利見大人蹇發其端而解要其終故復以天地推明之天地得解之時則和暢而為雷雨發生而為百果草木聖人體其時用則無所往而復吉者時也有所往而夙吉者亦時也聖人亦可謂得解之時者矣象曰雷雨作解君子以赦過宥罪雷雨之義震與坎也蓋震在坎下則雷雨鬱而為屯之象若震在坎上則雷雨散而為解之象雷雨作而百果草木皆甲拆故君子以之赦過宥罪罪與過屬坎之象乃法律之義赦與宥屬震之象天地發生之仁也初六無咎象曰剛柔之濟義無咎也難解之世初以隂柔在下無所事也故爻辭不言所事止曰無咎而已而象辭則以剛柔之濟言之蓋初六爻以柔處剛而上應乎九四爻之剛九四爻亦以剛處柔而下應初六爻之柔剛柔相濟際于難解之始義無咎也九二田獲三狐得黃矢貞吉象曰九二貞吉得中道也九二爻與六五爻正應當蹇難未解五以隂柔在下而處大君之位必資二之陽剛以濟其難此九二爻所以有田獲三狐之象二三四爻互離為網罟為田也坎為險為穴為隱伏狐也未濟卦坎體在下為小狐汔濟是已三狐謂坎體之三乃負寇致寇至之小人也二爻于解難之時歷三爻至五而獲之是謂田獲三狐耳若君子之于小人不為已甚獲之斯已獲三狐而得黃矢黃者中也矢者直也謂二以中直輔乎五而五亦以中直應乎二二者皆得其中以貞守之所以為吉六三負且乘致寇至貞吝象曰負且乘亦可醜也自我致寇又誰咎也陸本以致寇作致戎朝古易云其失自虞虞前皆依爻作寇三爻以隂柔居坎體之上險難之極也難極必解而介乎二陽爻之中二爻為坎險而三爻乘之四爻為互坎而三爻負之負可也負且乘不可也負且乘而二坎居其上下坎體為盜所以致寇至也而象為之發致寇誰咎之義雖貞亦可醜吝道也三其可不致戒哉九四解而拇朋至斯孚象曰解而拇未當位也九四爻震體為足動之初也足之大指為拇而汝也或謂拇為初爻雖隂柔與四爻為應剛柔相濟何事乎解惟六三爻失位不中不正麗乎震足之下其象為足之大指拇也介乎二爻四爻之間負乘致寇必解去之而後可以得朋朋者謂二爻與四爻同德四爻既比五爻二爻又為五爻之應五因二以信四朋至斯孚者也六五君子維有解吉有孚于小人象曰君子有解小人退也六五爻解卦之主也宜足以解天下之難矣而隂柔居尊未孚于小人故必資陽剛之君子而後足以有濟然君子所以待小人者陽剛或過未免縶而防之故謂之維惟六五柔中而輔之以二四爻之剛則剛柔相資解縱繩墨無所猜忌故君子維有解吉而小人自退聽此所以有孚于小人而為解道之甚善者也上六公用射隼于髙墉之上獲之無不利象曰公用射隼以解悖也上六爻居解卦之極而六三爻不相應其道為悖隼者六三爻也射之者上六爻也其位在上近于五爻六五爻以柔中居尊位既解其防小人之維則上六爻雖隂柔當解道之成時而能解悖于終故以公言之與離卦之上言公同故言公用射隼于髙墉之上蓋二互離為隼墉者三四爻內外之限若同人卦之九四爻言乘墉則乘三之剛以為墉上六爻亦以三爻為墉在上而射之故為髙墉又為髙墉之上之象大傳言動而不括是以出而有獲且獲之無不利解悖之道也周易總義卷十一
