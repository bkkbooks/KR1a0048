body:
  text: 周易總義卷一宋易祓撰上經乾乾上乾下􅅀乾已建􅅀夬辰建􅅀大壯建卯􅅀泰寅建􅅀臨丑建􅅀復子建亢飛躍乾乾見潛此伏羲所畫八卦重之為六十四周易以乾為首乾剛也不徒剛而已考之說卦其象不一故六爻之義皆以君道推之君道主乎剛中而以不中為戒初欲其勿用四疑其或躍以其在卦下而未得乎中三欲其惕厲上憂其亢悔以其在卦上而已過乎中惟二為見龍五為飛龍雖位有上下不同以其在卦中而皆剛中之位所以為君道之善然君道貴乎中不可過於剛變通不窮此用九所以為乾之吉也乾元亨利貞此卦辭也舊說文王所作自坤以下諸卦同乾純乎四德者也坤言四德而列牝馬於元亨利貞之間以順承乾已非乾德之純而聖人設卦乃復係之于屯隨臨革無妄五卦者蓋四德無所不寓而其用散見於萬物程子易傳曰元者萬物之始亨者萬物之長利者萬物之遂貞者萬物之成即是理而推之五卦之辭固與乾同然乾言四德純一不雜五卦雖係以德而下皆有戒之之辭夫子釋之謂諸卦之才不足以言元故以大訓之或云大亨貞或云大亨以正而皆不能純乎乾之德此乾之所以為大而無侔也初九濳龍勿用此以下爻辭也舊說周公所作自坤以下諸卦同九老陽也七少陽也少常老變易以變為用故乾爻不用七而用九以九為龍者龍陽物也乾純乎陽者也凡爻在卦下者皆謂之初今初之一陽起自黃鍾之宫乃雷在地中復之時陽氣至微象為濳龍以人事言之故曰勿用勿用者非不可用含蓄未試以養其全德者也九二見龍在田利見大人二居地位之上已出于濳其象為見龍在田在田之時君德未顯而爻言利見大人者乾爻不取臣位二與五皆為君德必至於五而後大人之德備則二之大人亦龍德之正中宜為天下之所利見者也九三君子終日乾乾夕惕若厲無咎九三六龍之一其不言龍何也三過乎二之中以九居之為重剛重剛不中乃至危之地一或不謹咎必隨至聖人作易謂三為人位之正故以人事為戒所以易龍之戒而係之以乾以其在上乾下乾之間是謂終日乾乾終日朝而夕也猶且惕若所以言厲厲者知危而懼是以無咎大傳曰無咎者善補過也九三有之九四或躍在淵無咎九四已離下體故謂之躍猶在上體之下故謂之在淵淵卑于田二言在田則四當躍而上行今反謂之在淵者淵乃龍之所宅非在田之比在田不能變而在淵有可變之道故或之或之者疑而未定之辭文言謂之進德修業欲及時時可以進則在淵有或躍之理進無咎也九五飛龍在天利見大人九五乾之主也以天德居中正之位是謂飛龍在天與二之見龍在田其位不同而皆言利見大人何邪或謂以二見五以五見二非也文言所謂善世而不伐則天下利見乎二又謂聖人作而萬物睹則天下利見乎五五與二果何以異觀乎在二則中而未正謂之大在五則中正居上謂之大而能化所處不同故也上九亢龍有悔乾之一陽始於子卦氣為復自子至已正屬上九卦氣為乾乾之六陽至上而極其義為亢故曰亢龍龍何有于亢哉時或亢而德不窮故稱龍焉龍為陽物極則能變必無致亢之理爻辭不言吝而言有悔者大傳於悔吝皆稱小疵然吝必至于凶悔猶可以趨于吉此乾之所以貴于用九也用九見羣龍無首吉首上也用者不宜用者也易本以乾之上九剛過為亢亢則必變故六爻之外繼以用九取譬龍無首為義而春秋傳載乾之坤亦曰見羣龍無首是知陽爻之變皆用九而于乾之羣龍無首發其例然則說卦何以言為首曰為首者乾剛之本體也無首者剛變而從柔也此用九所以吉彖曰大哉乾元萬物資始乃統天雲行雨施品物流形大明終始六位時成時乘六龍以御天乾道變化各正性命保合太和乃利貞首出庶物萬國咸寧此夫子所作之彖辭與卦下之辭通謂之彖自乾以下諸卦同大哉乾元者乾陽物也易以陽為大故曰大哉先以大哉歎美乾之元然後發明四者之德萬物資始乃統天者所以釋乾之元也雲行雨施品物流形者所以釋乾之亨也今考四時之序元者一陽生於建子之月卦氣為復故謂之始亨者六陽成于建已之月卦氣為乾故謂之終由始而終其間歷臨泰大壯夬皆六陽之位陽以大為體明為用大明終始則六陽之位以時而成當是之時乾乘六龍以御天所以成元亨之功用至一隂生于建午之月變乾之初爻為姤是為乾道之變化歷遁否觀剝是謂變而能化變有利之理化有貞之理此皆功用斂藏之實是以曲成萬物各正性命保合太和故總而名之曰為利貞曰利曰貞固屬乎六隂之月而必言乾道變化者乾陽用事常主嵗功隂則時出而佐之是以五隂剝陽之時卦位之乾已先臨乎西北又至建亥之月遇坤而戰戰乎乾而勞乎坎則一陽復生而為元萬物隨元而出焉是為四德之首首出庶物萬國咸寧者言域中之大事事物物各得其所此乾元所以始終而不窮也象曰天行健君子以自強不息此夫子所作卦下之象也自坤以下諸卦同乾天也凡重卦皆取重義而此獨言天者天一而已周天三百六十有五度四分度之一天道左旋一日一周有至健者存君子自強不息所以法天行之健所謂健者雖非重象而有重意乃所以見乾德之運行而不已也濳龍勿用陽在下也見龍在田德施普也終日乾乾反復道也或躍在淵進無咎也飛龍在天大人造也亢龍有悔盈不可久也用九天德不可為首也此夫子所作爻下之象也自坤以下諸卦同卦之六畫三才之位也初二為地三四為人五上為天以乾六爻考之初之陽在下者陽氣濳伏于下而未出于地二之德施普者陽氣著見于地而普及于物此二爻地道也三之反復道者始涉人位而反欲復乎二之中四之進無咎者已出人位而往欲進乎五之中此二爻人道也五之大人造者正居天位而有興造之義上之盈不可久者動循天理而有持盈之戒此二爻天道也天德不可為首者又指乾剛之變者言之變則通通則久乃天道不窮之用此用九所以繼于六爻之後也文言曰元者善之長也亨者嘉之會也利者義之和也貞者事之幹也君子體仁足以長人嘉會足以合禮利物足以和義貞固足以幹事君子行此四德者故曰乾元亨利貞此夫子所作釋卦辭之文言也并以下釋爻辭凡七坤同文言者因卦彖之所未言而重之以文也彖辭所釋元亨利貞則造化之功用文言所釋元亨利貞則君子體易之功用蓋天下之理元者始也亦謂之善物之止乎艮而出乎震善之長也亨者通也亦謂之嘉物之齊乎巽而見乎離嘉之會也利者順而遂者也必以義而後濟物之役乎坤而悅乎兌義之和也貞者正而固者也必以事而後著物之戰乎乾而勞乎坎事之幹也是以在乾為元在君子則為仁仁者萬物所宗故體仁足以長人在乾為亨在君子為禮禮者百嘉所會故嘉會足以合禮在乾為利而君子以義處之義之得其宜而利存焉故利物足以和義在乾為貞而君子以事處之事雖沓至而有貞夫一者存焉故貞固足以幹事行此四德者君子之德推本而論則乾之德也故曰乾元亨利貞初九曰濳龍勿用何謂也子曰龍德而𨼆者也不易乎世不成乎名遁世無悶不見是而無悶樂則行之憂則違之確乎其不可拔濳龍也濳龍勿用是謂龍德而𨼆者也不易乎世則所守在我不隨世而變也故遁世無悶不成乎名則不求聞于時雖舉世非之而不加損也故不見是而無悶蓋其憂之樂之在道而所行所違之正確乎自信是以勿用也九二曰見龍在田利見大人何謂也子曰龍德而正中者也庸言之信庸行之謹間邪存其誠善世而不伐德博而化易曰見龍在田利見大人君德也以九居二中而未正非五之比五中正之位也而二言龍德正中者有正中之德而已故曰庸言之信庸行之謹間邪存其誠所以釋在田善世而不伐德博而化所以釋利見蓋二在內卦之中為君德五在外卦之中為君位居正中之位者必有正中之德此文言于九二所以兩言君德也九三曰君子終日乾乾夕惕若厲無咎何謂也子曰君子進德修業忠信所以進德也修辭立其誠所以居業也知至至之可與幾也知終終之可與存義也是故居上位而不驕在下位而不憂故乾乾因其時而惕雖危無咎矣三居人位重剛而不中其道至危者也知危而惕厲者惟進德修業而已蓋德以心而言業以事而言忠信者則真實其本然之心所以進德也修辭立其誠者則推廣其真實之理所以居業也知至而至之進德之事也先知其有可至之道故可與幾知終而終之居業之事也能知其有保終之道故可與存義此居上與在下皆得其道矣所以乾乾惕厲雖危而無咎也九四曰或躍在淵無咎何謂也子曰上下無常非為邪也進退無恆非離羣也君子進德修業欲及時也故無咎三與四皆人位也三居下卦之上乃惕厲之地故以進德修業戒其進四居上卦之下有或躍之理故以進德修業勉其進若四則乾道始革何常之有上下以位論謂離乎下體而入乎上體非為邪也進退以爻論謂下退則三而上進則五非離羣也君子進德修業欲及乎時而已也此三之與四所以皆言無咎者也九五曰飛龍在天利見大人何謂也子曰同聲相應同氣相求水流濕火就燥雲從龍風從虎聖人作而萬物睹本乎天者親上本乎地者親下則各從其類也九五之利見大人與九二之利見大人相同二非君位而有君德者也物已利見其大人五以天德居天位者也所謂大人者尤天下之所利見凡天下之同聲相應同氣相求其類固不一水潤下而流濕火炎上而就燥龍翔于淵而雲滃虎嘯于山而風烈以至本乎天者親上本乎地者親下非有以使之而然而自有不能不然者故各從其類而已人為聖人之類聖人該天地萬物之理其所以利見者尤大也大而化之則聖矣故言聖人作而萬物睹聖與大非有異用在乎化與未化而已未化者九二之德即所謂充實光輝之大已化者九五之德即所謂大而化之之謂聖也上九曰亢龍有悔何謂也子曰貴而無位髙而無民賢人在下位而無輔是以動而有悔也上之所以為亢者何也九五以陽剛居中正之位而上過乎五故曰貴而無位初在下為民而上遠于初故曰髙而無民二以在下得中為賢而上非二之應故曰賢人在下位而無輔當是時也不動則已動則有悔悔而能變則知所以處亢矣濳龍勿用下也見龍在田時舍也終日乾乾行事也或躍在淵自試也飛龍在天上治也亢龍有悔窮之災也乾元用九天下治也此文言釋爻辭之二也上文言乾之德此則推明乾德之用也下者濳伏于地而勿用也時舍者出居于地而尚未用也行事者見諸人事而宜于用也自試者蓋反求諸已不輕于用也上治者居上治下而大其所用也窮之災者亢則有悔而不可過于用也用九而言天下治者得變通之用故以乾元言之元其始終不窮者歟濳龍勿用陽氣濳藏見龍在田天下文明終日乾乾與時偕行或躍在淵乾道乃革飛龍在天乃位乎天德亢龍有悔與時偕極乾元用九乃見天則此文言釋爻辭之三也上文言乾德之用此復言所用之時初在下者為陽氣濳藏二居中者為天下文明三欲進乎上者為與時偕行四已離乎下者為乾道乃革五中正在上者為位乎天德上以陽過乎剛者為與時偕極至于用九而言乃見天則者剛而能柔天則之自然所以貴乎時用也乾元者始而亨者也利貞者性情也乾始能以美利利天下不言所利大矣哉此文言再釋卦辭也乾德之所以為大者一理而四名也上文析而為四所以詳釋卦辭之義而未足以見其全體至此則比而為二蓋萬物萌蘖之始其中已有發生長養之意故曰乾元者始而亨者也性以順為利情以正為貞皆收斂歸藏之時故曰利貞者性情也繼此又混而為一曰乾始能以美利利天下不言所利始者元也美者亨而嘉也不言所利者不可以定所指名之也有利則有貞而貞亦寓于不言之中以全體論之信乎四德之所以大也大哉乾乎剛健中正純粹精也六爻發揮旁通情也時乘六龍以御天也雲行雨施天下平也此文言推廣卦辭也大矣哉之後復贊乾之全體謂乾道之大此七者是也自其當位者言之惟九五為然九為陽剛五為用健以九居五則其中而正九五位乎天德則其體純粹而為至精之極然則何以謂之六爻發揮旁通其情以爻言之則五爻為旁通而九五得其正以卦言之則卦之全體得其正而六爻皆旁通也是以自初至上皆為龍德所以為剛健自濳至亢皆為龍德之用所以為中正龍德至于用九而變通不窮所以為純粹而精非全體之所發見者乎全體之中七者之功用行焉所謂大者無以加于此君子以成德為行日可見之行也濳之為言也𨼆而未見行而未成是以君子勿用也此以下文言釋爻辭之四也初之濳龍勿用者未至于見也所謂成德為行日可見之行者乃見龍之義也若夫濳則𨼆而未見行而未成在君子豈可以遽用此所以反復發明濳龍之義耳君子學以聚之問以辨之寬以居之仁以行之易曰見龍在田利見大人君德也二之見即初之濳也濳則德之未成者見則德之已成者學聚問辨固成德之階寬居仁行乃日可見之行此以見龍在田利見大人為君德者所以别乎濳龍之未見未成者也九三重剛而不中上不在天下不在田故乾乾因其時而惕雖危無咎矣九三乘承皆陽又陽居陽位重剛也已過乎二而未及乎五故言不中上不在天謂非五也下不在田謂非二也以三為人位之正故以人事言之重剛不中危亦甚矣所以再三發明惕厲無咎之意九四重剛而不中上不在天下不在田中不在人故或之或之者疑之也故無咎四非重剛也以九居之乘承皆陽故亦言重剛且四之與三皆言上不在天下不在田而四獨言中不在人者上卦之下乾道乃革謂之躍則可以離人而進乎天惟以其陽而居隂猶言在淵則未免疑或之或之者未定之辭四之疑固異乎三之危然而皆言無咎者知所戒懼故也夫大人者與天地合其德與日月合其眀與四時合其序與鬼神合其吉凶先天而天弗違後天而奉天時天且弗違而况於人乎况於鬼神乎夫大人者九五也位乎天德乃大而化之之聖也故上之文言曰聖人作而萬物睹至此則德合乎天地明合乎日月序合乎四時吉凶合乎鬼神先天而行天不能違乎聖人後天而行聖人有以奉乎天之時天與人與鬼神皆不能違則又極于聖而不可知之之神矣亢之為言也知進而不知退知存而不知亡知得而不知喪其惟聖人乎知進退存亡而不失其正者其惟聖人乎易之為道進有退之理存有亡之理得有喪之理此上九所以為亢聖人處亢則何以不言得喪而言進退存亡之故蓋進退存亡則在我者也得喪則效之見于彼者也聖人以天德處亢則得喪有所不足論此所以為進退存亡之不失其正即其惟聖人而兩言之嘆美之不足而又嘆美之也周易總義卷一
