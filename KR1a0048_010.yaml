body:
  text: 周易總義卷十宋易祓撰下經咸兑上艮下􅄲􅅀􅅀􅅀􅄲􅄲輔頰舌脢思服腓拇咸之成卦艮在下兊在上卦辭言吉而諸爻皆不純乎吉者何也咸感也感以心為主而偏體皆所感之一初為感之始故曰感其拇二為感之正故曰咸其腓三曰感之過故曰咸其股曰拇曰腓曰股則非其所當感者也五應二而未免乎私意故曰咸其拇上應三而容說以為尚故曰咸其輔頰舌曰拇曰輔頰舌皆不足以為感者也惟所感出于心故皆以咸字明之若九四當上下往來之間其位為心故不言咸而言所感之道所感得其道則謂之貞吉所感非其道則有朋從爾思之戒六者其職各舉其偏體所感皆以心為之主惟聖人能盡咸感之道者歟咸所以利貞也咸亨利貞取女吉彖曰咸感也柔上而剛下二氣感應以相與止而說男下女是以亨取女吉也天地感而萬物化生聖人感人心而天下和平觀其所感而天地萬物之情可見矣咸之所以為感者咸之卦本否卦之體三爻上爻相易是謂柔上而剛下二氣感應自然之理也二氣感應以相與者艮卦止于下而感之者至兊卦說于上而應之者切男下于女是得男女之正者故曰亨利貞取女吉也豈惟取女哉蓋天地萬物以情言則所感無不通惟利乎貞則天地感而萬物化生矣聖人感人心而天下和平矣此義廣言相感之理感之者至也象曰山上有澤咸君子以虛受人澤在山之上山以虛中而受澤之氣者也蓋惟虛故始能受惟受故始能感惟感故始能通是以君子體之以虛受人者也所以感無不通蓋納汙藏疾之義云爾初六咸其拇象曰咸其拇志在外也初六者艮之始也艮以止為義而初居艮體之下尤不可以妄動惟其上應六四之爻四在外卦而初欲從應故象曰志在外也然咸卦六爻之義皆以身為喻初履隂居下為拇拇為足之大指乃一身之中至微者身雖未動而拇有欲往之志志方在外而聖人已為之戒懼其一搖足而不可止則未有不失其正者然不言凶與悔者以其居動之始而猶可以或止者也六二咸其腓凶居吉象曰雖凶居吉慎不害也腓者在拇之上股之下足之肚也足動而拇應於下股應於上腓居其中不能止其行又從而順之順物而動乃凶之道也然二爻艮體為止得中守正所以貴乎能居居者謂居中則不一於隨雖順而不害故曰居吉也然吉凶並言者以二之得中而知所擇之故也九三咸其股執其隨往吝象曰咸其股亦不處也志在隨人所執下也處者止也三爻與初二兩爻皆居咸之下體初二爻隂柔在下感陽而動故為拇為腓三爻以陽剛之才為艮之主宜其止而不動者顧乃說乎隂而欲應乎上故曰咸其股股在拇腓之上謂其隨拇腓而動不異乎初與二爻故象曰亦不處也蓋三與上為正應所感在上故言不處而所執在下故言志在隨人三以陽居陽在艮止之終不能以靜處之者見上之可說乃隨人以往是謂知隨而不知止此所以為往吝者也九四貞吉悔亡憧憧往來朋從爾思象曰貞吉悔亡未感害也憧憧往來未光大也九四取象居腹之上脢之下又為三陽之中以序言之當曰咸其心心者一身之君主也不可與脢股同列則言其所感之道何謂道也貞吉悔亡是也曰係於初六之私應固不免於悔貞吉悔亡則未免為感道之害惟下體已往上體方來且以上下二陽為明乃勞思以應之故言憧憧往來朋從爾思蓋一涉於私纍於偏則所感益狹未為光大然則四之不言感者果何取于感大傳申言之曰天下何思何慮推而至于日月寒暑之往來尺蠖龍蛇之屈伸以至窮神知化之所以然蓋無非所以發明爻辭之意以明所感之道也九五咸其脢無悔象曰咸其脢志末也五居尊位當思萬物為一體而後足以盡咸感之道然九五之應在六二二以艮體止于下五以兊體說于止方其未能相感而上居一體之末以滕口說為尚小人也五或近而說之不可也故有咸其脢之象脢者背肉也與心相背者也五既志于上六之末則有親狎小人之悔故欲咸其脢以背其志之所向既舍乎上必應乎二中正相與庶乎其可然專應乎二則心纍乎私與萬物不相通亦不足以言吉僅能無悔而已上六咸其輔頰舌象曰成其輔頰舌滕口說也咸之為道也自拇而股主于足之舉止者也自心而脢主于身之動寂者也至上六爻處兊之極正兊為口之象也隂柔容說而以滕口說為尚者故曰咸其輔頰舌曰輔曰頰曰舌皆兊體為口而不言口者以三者雖動而未發于口豈知所謂感者乎夫感以無心為先而出于心思者次之九四爻涉于思所感已狹况乎滕口說以為說感道之窮也與諸爻豈可同語哉恆震上巽下􅄲􅄲􅅀􅅀􅅀􅄲振恆恆其田無不德禽恆悔亡浚恆恆之成卦巽居下震居上震者長男也巽者長女也男以動而居外女以順而居內乃人道之正而六爻皆不純乎吉者何也中與不中而已二五兩爻以中相應故二悔亡而五恆其德貞初爻與四爻不及乎中三爻與上爻過乎中故初與上皆凶而四至于無禽三至于貞吝是人道戒乎不中而貴乎中也然漸之為卦亦男女之正惟漸之二五爻中而得位故二爻皆言吉恆之二五爻中而不當位故亦至於悔亡婦人貞吉而已聖人欲明男女夫婦之正于恆之卦義尤拳拳三致意焉恆亨無咎利貞利有攸往彖曰恆久也剛上而柔下雷風相與巽而動剛柔皆應恆恆亨無咎利貞久于其道也天地之道恆久而不已也利有攸往終則有始也日月得天而能久照四時變化而能久成聖人久于其道而天下化成觀其所恆而天地萬物之情可見矣恆之所以為久者恆之卦本泰之體初四相易是謂剛上而柔下上下惟變所適烏得無咎然論卦之全體震以長男位乎外巽以長女位乎內雷風相與者也巽以隂柔順于下震以陽剛動于上巽而動剛柔皆應者也以此論恆所以為亨何咎之有然必先于利貞者天地之道久而不已無非此理之正故利有攸往利有攸往者始也久而不已者終也終則有始天道之常也極而至于日月之得天四時之變化聖人久于其道以至觀其所恆而天地萬物之情可見情者謂始終之理見其情者則恆久之道著焉者矣象曰雷風恆君子以立不易方居其所而不易者謂之方常也而雷風則非常之物也以非常之物而係之于常又言君子立不易方果何所取于雷風之義歟蓋天下之道惟常與變二端適變者必以常為主不然則因利乘便巧詐之人而已矣君子體之以立不易方則凡盈乎天地之間凡如雷之動者如風之散者亦皆可常之道也故曰雷風恆初六浚恆貞凶無攸利象曰浚恆之凶始求深也浚者深也天下之理深必有漸初以隂柔在下又巽體務入未可深求乎應四雖正應在上震體陽性上而不下不度𫝑力而深求之故曰浚恆也凡人道之交始而遽求深則疏辱隨之矣恆已戒乎深求而復守之以貞夫貞者謂有心于固執乃取凶之道也何利之有九二悔亡象曰九二悔亡能久中也二爻五爻正應也在恆之義五言夫子制義則二為婦道婦人以剛德居柔烏能無悔惟二以巽體之長女居于內剛得中而有所制五以震體之長男居于外柔得中而有所立剛與柔相濟夫與婦永終是謂久中臣道子道亦然而以婦道推之此久中所以悔亡也九三不恆其德或承之羞貞吝象曰不恆其德無所容也三與初四上四爻皆不恆其德者也而三爻為尤甚陽剛不中居巽體之終變態不常之人而已果能恆其德者乎夫德之不常進退皆無所容不特自羞而已且被及于他人而或承之者初與四上皆羞也故曰或承之羞以貞守之而又固執以為恆是以終至于吝九四田無禽象曰久非其位安得禽也四與二爻皆陽居隂位故二爻不言恆而言久久所以用其恆也恆以得中為貴乃可久之道二爻久于中是以悔亡四爻不得中久非其位矣非其位而為動之主動而無獲故曰田無禽蓋古人取禽有時田之禮取非其地無禽之象巽卦之六四田獲三品在乎得位此則失位不中且不能常何以為久宜其無所獲也六五恆其德貞婦人吉夫子凶象曰婦人貞吉從一而終也夫子制義從婦凶也六五爻君位也以九居五則為恆以六居五則為非其恆六五非其恆而謂之恆其德者恆其柔順之德而己故此爻設為二義謂柔順為恆者婦道也以貞而固執之者婦人之守正者也處以婦人則惟夫子是從是謂從一而終也所以為吉然六五爻居震體長男之象處以夫子而固執其柔順乃婦人之德失制義之道此從婦所以為凶也蓋六五爻柔順之才下從九二之爻故以為戒言夫婦則君臣父子之義可知也上六振恆凶象曰振恆之凶大無功也上六以隂柔居一卦之極乃震體之終者也是謂亟于動而不能安其常故曰振蓋振者動之亟也凡居上之道必有常德安靜守正不亟于動不動則已動必有功今以庸人擾之浸為禍階不特無功且大無也此振恆之所以為凶也遁乾上艮下􅅀􅅀􅅀􅅀􅄲􅄲肥遁嘉遁好遁係遁黃牛之革遁尾遁之成卦艮居下乾居上二隂浸長而四陽漸退為遁之象遁者退也蓋天下無不可為之時豈以處退為賢哉不過順以處之而已聖人為君子慮必有以示其扶陽抑隂之道初爻之隂柔在下則戒之以勿用攸有往二爻之隂柔得中則戒以執之用黃牛之革自此以上則皆君子處遁之道三爻近于二畜以臣妾故曰係遁四爻應于初與之同好故曰好遁五爻應于二而以中順為嘉上爻雖無應而陽剛充裕故曰肥遁自三至上曰吉曰無不利而皆無貶辭宜乎四陽當遁之時以進為退而二隂皆順遁之所以亨也遁亨小利貞彖曰遁亨遁而亨也剛當位而應與時行也小利貞浸而長也遁之時義大矣哉遁無亨之理能善處之則亨也如剝卦之世順而止之猶能以一陽而剝去小人之廬况遁卦四陽在上之時哉以卦體推之九五陽剛得位而六二亦以中正相應隨時消息即時行之義也所謂小利貞浸而長者與臨卦之言浸長同意臨之彖曰剛浸而長遁卦二隂也彖亦曰浸長而不言柔所以戒隂于無形而艮體二隂止而不行故曰小利貞小者利貞則小人皆為君子之歸矣知時義之大則知所以處遁之道矣象曰天下有山遁君子以逺小人不惡而嚴君子之逺小人也如山在天下𫝑不相及是謂不惡而嚴也嚴則不得而親不惡則不得而疏非有心于逺自然相逺故也初六遁尾厲勿用有攸往象曰遁尾之厲不往何災也易卦以上爻為首初爻為尾遁之二隂尚往而初隨之故以尾為言也蓋尾雖不為主而與六二爻同類若隨之而往則消陽有漸非二之福也所以危而言厲厲之不已則災繼之果何以遽往哉初爻艮之體為止故戒之以勿用有攸往而象亦曰不往何災初可往乎六二執之用黃牛之革莫之勝說象曰執用黃牛固志也卦之二隂皆遁也而二爻不言遁者二隂尚往有消陽之理所幸艮之體為止六二之爻有中順之德而上之九五陽剛為正應欲固其相應之志故言執之用黃牛之革二在巽體為順牛順物也黃中色也革堅物也執之用黃牛之革則二以中順之德固其志以應五而五之于二當位而應是謂莫之勝說也此六二之爻雖不言遁而自有止而不往之理遁之善者也九三係遁有疾厲畜臣妾吉象曰係遁之厲有疾憊也畜臣妾吉不可大事也九三比于六二當二隂浸長之時從而係屬之若係小子之係故曰係遁也然係之而不能畜將有消陽之理此係之病也故爻言有疾厲而象亦言有疾憊惟九三以陽剛當位二隂為我所畜當以臣妾畜之傳言男為人臣女為人妾則馴服于下而役屬乎我也正如剝卦之六五爻以宫人寵羣隂之類惟厚其恩而不任以事言其不可以大事也故爻曰畜臣妾吉九四好遁君子吉小人否象曰君子好遁小人否也九四爻與初六爻正應也初爻以隂柔在下浸長而未盛樂于從應與之同好故曰好遁也好非君子之志也聖人以四初二爻皆非中正或至阿其所好故設為二義謂君子能以道制欲所守不易以此為好故謂之吉也若小人處此昵比無間乃陷溺而不自知覺故謂之否也九四爻居上卦乾體之下其非小人者也而必言小人者正欲使小人為君子之歸者也九五嘉遁貞吉象曰嘉遁貞吉以正志也九五以陽剛居尊位正彖所謂剛當位而應應者應乎二爻也六二隂也何以謂之嘉遁也夫有所謂嘉禮有所謂嘉㑹有所謂嘉耦皆交通相與之義也六二以順柔固其志以應九五而九五亦正其志以為六二之應二五爻在中為心位故皆言志曰固曰正者皆貞之義也此遁卦之九五能嘉遁所以為貞吉者也上九肥遁無不利象曰肥遁無不利無所疑也遁之上卦乾體四五爻以陽剛之德下應于初二之爻未免有所偏係矣惟上九之爻處一卦之外無應于下而陽剛有充裕之象故曰肥遁也而象言無所疑者與坤卦之六二爻文言同也蓋有所疑則害于行而利于行者自無所疑君子之待小人可不以誠心孚之哉上九非當位之人不與二隂為應超然在上不以其身處于有所疑之地是以肥遁無不利者也大壯震上乾下􅄲􅄲􅅀􅅀􅅀􅅀羝羊喪羊羊藩羝羊貞吉趾大壯之成卦乾在下震在上謂之大壯者與大畜大過同義皆陽盛之卦也然大畜則陽有所止矣大過則陽比于弱矣未若大壯之體乾健震動其壯孰有大于此者故爻以陽盛為戒也初爻與三爻之陽居陽位所以凶厲二爻與四爻之陽居隂位所以貞吉五爻雖陽位而居之以六能不過于用壯所以無悔上爻雖居壯之終而才與位皆隂雖無攸利而克艱則吉凡六爻之義皆所以戒乎陽剛之過孟子曰至大至剛以直飬而無害則塞乎天地之間即卦體利貞之義也飬之苟得其道大壯之所以為大者也惟君子能之大壯利貞彖曰大壯大者壯也剛以動故壯大壯利貞大者正也正大而天地之情可見矣大者陽也陽道常饒故以壯名之蓋大壯之時陽過乎剛或乖于正故卦辭獨係以利貞二字謂乾剛在下而震動于上大固所以為壯壯而不正為暴而已故以貞為利也或曰貞者正也易之爻例以當位為正而其不當位者不正今九二九四六五三爻則以不當位而皆利初九九三上六三爻則以當位而皆不利是諸爻之利何取乎正蓋大壯以陽盛為戒剛過乎暴則其正乃所以為不正故彖辭曰大者正也至此復以天地之情極言之是知天地之間陽剛運行其道常久而不已者亦無非大者之正正大而天地之情可見大壯之義也象曰雷在天上大壯君子以非禮勿履天以雷為壯人以禮為壯蓋天下暴亂惟禮可已故語天下之壯者莫如禮夫禮者天理也凡人能勇于一决者皆可以赴湯火蹈白刃惟不出于天理之正是以雖壯而易撓者也此君子非禮弗履所以為大壯也初九壯于趾征凶有孚象曰壯于趾其孚窮也大壯之卦乾在震下為足初在其下為足之趾趾所以行也陽剛妄動有壯于趾之象則不可以有行其征必凶何以復言有孚孚者謂三陽在上為同類同類並進重剛為暴雖有孚而過于用壯故象曰其孚窮也九二貞吉象曰九二貞吉以中也易之諸卦隂陽貴乎得位惟大壯之卦陽剛或過則以陽居隂位者為吉蓋以慮其陽剛之過于壯者也故二爻與四爻皆言貞吉然九四之貞吉而非中故爻辭以悔亡戒之九二之爻中而無悔故以剛履柔而能不以用壯為壯壯之正者也此爻辭所以獨言貞吉九三小人用壯君子用罔貞厲羝羊觸藩羸其角象曰小人用壯君子罔也大壯以陽盛為戒而九三乘承皆剛又重剛不中非大者之正在小人則有勇無義而為盜在君子則有勇無義而為亂故小人直用其壯君子故不免于用罔罔者謂不直夫子曰人之生也直罔之生也幸而免以罔對直若用罔不直為可知以直養之乃非禮勿履之義今君子用罔是不能養之以直何以異乎小人之用壯是以貞亦厲蓋三本坤體以初二爻變乾成兊有羝羊之象三陽剛居乾體之上則為角九四以陽剛阻之則為藩言君子小人當大壯九三之時雖其才品不同而皆非所謂用壯之正故言觸藩羸其角此所以深戒乎陽剛之過也九四貞吉悔亡藩决不羸壯于大輿之輹象曰藩决不羸尚往也四陽並進已極于壯安得無悔惟陽居隂位是為貞吉而悔可亡往而上行藩雖决而其角不羸故其剛闕太剛必折之患以此尚往則陽剛之壯足闕大輿之輹輹者軸之傳輹壯則輿强其利為闕利而行亦所以為君子之壯也六五喪羊于易無悔象曰喪羊于易位不當也六五在上而四陽在下皆以變乾成兊為羊之象羣羊並進其性善觸茍以剛應之則以剛敵剛其壯必窮矣能無悔乎惟六五爻履剛以柔位雖不當乃以柔中處之而無所用其壯矣故曰喪羊于易也夫所謂易者蓋不勞餘力而四陽皆順之所以謂之無悔也上六羝羊觸藩不能退不能遂無攸利艱則吉象曰不能退不能遂不詳也艱則吉咎不長也古王肅孔以詳為祥善也朝氏古易按古文祥字為詳也闕隂柔在上非用壯也何取乎羝羊之象處震體之極而下有九三正應既不能退而和順又不能闕事雖無羸角之厲既不能退而和順又不能闕事是謂不詳惟以艱守之咎不長也此與臨六三爻同義闕爻皆以居極而變臨以三爻變而成泰之卦大壯以上爻變而成大有之卦皆君子自反之道所以吉也晉離上坤下􅅀􅄲􅅀􅄲􅄲􅄲角悔亡石鼠衆允愁如摧如晉之成卦離居坤上順而能麗以進為義明出地上闕以臨諸侯順而麗乎大明諸侯所以承天子闕體之五也順而麗則三隂麗乎大明也初闕進處之以裕則無咎二雖進而未免乎憂闕以中正則介福三則進道已成故衆允而悔亡闕三爻雖坤體之至柔其順而麗者乎至四與上惟獨以陽剛處之故二爻皆言麗然四近君位有貞厲之象也而上處一卦之外雖以厲吉亦不免于貞吝非順而麗之者也然與五同為離體而下承乎坤隂之順所謂順而麗者當以卦之全體見之晉康侯用錫馬蕃庶晝日三接彖曰晉進也明出地上順而麗乎大明柔進而上行是以康侯用錫馬蕃庶晝日三接也闕彭氏曰康侯用錫馬蕃庶享王之禮也錫猶闕錫錫貢之類享禮匹馬卓立九馬隨之故曰蕃庶也晝日三接王接侯之禮也覲禮延升一也覲畢致闕致命二也享畢王勞之升成拜三也闕易以元亨利貞為卦德而晉獨不言德而彖辭特以進為義何也明進而盛者也明出地上則以卦之全體言之順而麗乎大明則以坤體之三爻麗乎五者言之柔進而上行則以晉自觀來柔進于五者言之此君明臣良千載一遇之時君子可以進矣所以謂之晉康侯是已諸侯能寧其一國之民故謂之康侯康侯上近天子之光故有亨王接侯之禮蓋下為坤之體則為衆為牝馬有錫馬蕃庶之象上卦離為日為火有晝日三接之象此君臣相過之盛所以彖辭有晉者進之義雖卦不言德而卦德可知也象曰明出地上晉君子以自昭明德明出地上晉可以進也君子之進必反求諸已而後闕行于人明德之昭非人昭之自昭而已此自求多福自作元命之義也初六晉如摧如貞吉罔孚裕無咎象曰晉如摧如獨行正也裕無咎未受命也晉諸爻皆以進為義初六以順體在下當晉之始乃欲進而向乎明故曰晉如去大明為最逺猶為在上所阻故必深自抑損而不輕于進故曰摧如進而不合君子亦不可枉道以徇人必戒之以守正則可得吉罔孚者無求信于人也在下者不能使人之必信悻悻然必求人之信已咎且至矣惟未受命之時我無官守我無言責其進退豈不綽綽然有餘裕哉以是而行故言無咎六二晉如愁如貞吉受兹介福于其王母象曰受兹介福以中正也二隂柔中正當晉之世出任輔君之責而五不應于上進而愁焉故曰愁如愁與憂同惟其能憂故不與上應惟其能守乎正是以貞吉何謂吉在我者正矣闕居中守正而已雖不忘天下之憂闕應焉不求而福自來故言受兹介福于其王母隂位之至尊者也謂六五也六三衆允悔亡象曰衆允之志上行也居坤體之上三隂之衆同志而已故曰衆允允者信也闕體為衆以晉之時觀之初六之進則謂之摧如六二之進則謂之愁如非以其柔而在闕柔而隂居陽位為上所應是謂衆允闕所以為悔亡也六四晉如鼫鼠貞厲象曰鼫鼠貞厲位不當也闕所守也古易鼫一本作碩取詩之鼫鼠闕蔡雍勸學篇云鼫鼠五能不成一技釋闕也闕晉之下卦坤也坤體以柔順進乎上九四以剛體獨以剛進焉就二爻言之上處一卦之上而不進于五剛居柔位是謂不當象謂鼫鼠鼫鼠之進雖貞亦厲戒之切也六五悔亡失得勿恤往吉無不利象曰失得勿恤往有慶也五與三皆不當位故皆不言晉者宜有悔也三順而五居中是以悔亡五以君位居尊在卦為柔進而上行有闕君之象失得勿恤乃進者之事如成康闕陕初不較一時之失得而惟以憂天下闕桓文之徒始課利計功于是有失有得闕是以為君者中道而立優逰無為委闕慶吉無不利蓋君臣相得為慶也上九晉其角惟用伐邑厲吉無咎貞吝象曰惟用伐邑道未光也闕莫不善于剛上與四言厲以剛闕貞厲上處一卦之外無所復進闕牝牛為體以九居上有角之象非當進而進乃晉道之窮蓋坤為邑離為伐有隹用伐邑之象程子謂伐其居邑為治內治闕處吉且無咎而象言未光者謂守貞闕以此求進如角之抵藩非我傷物則物必傷我矣周易總義卷十
