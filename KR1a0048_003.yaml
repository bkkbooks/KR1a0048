body:
  text: 周易總義卷三宋易祓撰需坎上乾下􅄲􅅀􅄲􅅀􅅀􅅀入于酒出自穴食穴泥沙郊需之成卦坎居乾上乾之三陽在下欲進于上而二隂間之所以為需也然所需不在二隂而在坎中之一陽九五陽剛以中正居尊天下之大利歸焉故係以酒食之象蓋其坎體為水三陽以逺近于水而取義初需于郊則逺于水者也水有逺近而二隂居其上是以有凶有吉惟九五與之同德故言需于酒食酒食之利同德所需是以三陽上行不隔于二隂而二隂敬順與三陽同麗于五上下皆順需道之成者也需有孚光亨貞吉利涉大川彖曰需須也險在前也剛健而不陷其義不困窮矣需有孚光亨貞吉位乎天位以正中也利涉大川往有功也需之為言須也乾之三陽在下為君子之象前遇坎險必有所需而後進坎之所以為險者二隂也二隂者小人之象也隂險在上為三陽之害若不可以進矣惟三陽與五同德是以二隂不能陷而無困窮之義蓋坎體中實三陽待之而孚故曰有孚坎險在前而剛不掩焉故曰光亨剛以健行而守以正固故曰貞吉備是三德是以位乎天位居中履正而獨得進退君子小人之權三陽並進而君子得以用其剛二隂遜避而小人無以施其險以此而往何向不濟此所以利涉大川而往有功也象曰雲上于天需君子以飲食宴樂雲上于天需之象也何與于飲食宴樂乎夫宴樂與憂患為對而九五自為險體二隂居其上下未免涉憂患之域雖有飲食其能安乎惟剛健得中衆陽俱進共與之濟險則所需得其道此飲食所以為宴樂也初九需于郊利用恆無咎象曰需于郊不犯難行也利用恆無咎未失常也需以乾之三陽上行而坎體在前姑少須之初去險尚逺有需于郊之象曠逺之地上有二陽為援初隨之而進又與四為正應而小人無害君子之意不犯險難而行者也以乾陽之性不犯險難則勇于必進變常者多矣顧乃以安靜處之未失乎常雖進不遽待時而已以此涉世何咎之有九二需于沙小有言終吉象曰需于沙衍在中也雖小有言以吉終也沙去險為漸近未之溺也故二言需于沙沙以衍而在中何憚而不進然前有六四之險未免于小有言君子處之豈直與相交為敵者哉惟其得中平其心以待之小人自不得以用其險此所以爻謂之終吉而象謂之吉終也九三需于泥致寇至象曰需于泥災在外也自我致寇敬慎不敗也泥之于水最近而逼又其性善陷非若沙之不陷而逺于水也二之需于沙已不免小有言至三則重剛不中乃君子過于用剛而四以小人阻之隂險在前故言需于泥泥則陷于坎險之中坎體為盜寇也災也了齋陳氏曰災在外則非我自我致寇則非人非我者無妄之災非人則敬慎在我况九五以同德相濟之雖勇于進而不敗也此九三之所以不病于剛也六四需于血出自穴象曰需于血順以聽也六四坎體之小人也方五之一陽陷于險中三陽上行同德濟險乃君子道長之漸而四以隂柔在上獨與之抗當是時也坎為血言需于血則隂類之傷也坎以陷為穴言出自穴則隂出而避之也方其未出也所謂四者為險為難為災為寇及三陽上應于五而四亦與初為應君子亦非輕絶乎小人也需其自委順而聽命云爾九五需于酒食貞吉象曰酒食貞吉以中正也坎體多言酒食如困于酒食之類以九居二養之失其道則為困以九居五養之得其道則為需五其需之主歟大象言雲上于天需君子以飲食宴樂宴樂與憂患為對若周之文武猶未免涉憂患之域至成康而后可以言宴樂所需至此得矣然玩所樂而忘所戒則宴安之鴆其毒尤慘惟五以陽剛得中則酒食雖宴樂之時而常以正守之故曰貞吉上六入于穴有不速之客三人來敬之終吉象曰不速之客來敬之終吉雖不當位未大失也上不言需者需至于上無所復需也故言入于穴穴一而已上入于穴則得所安四出于穴則有所傷何也四當三陽之衝必有所傷然後出自穴以避之而三陽與五為應上居九三相應之地必有所安然後入于穴而與三陽同比于五三人三陽也客者乾西北之位也速遽也不速之客三人來者謂君子上進而小人遜順至上六而獲見蓋上六與九三相應九三以敬而不敗故上六亦以敬而獲吉若初與二雖不當相應之位敬其一不敬其二則必失其陽剛之類三陽皆敬同比于五未為大失是以上六得所安而終吉固異乎六四之有所傷而後順也訟乾上坎下􅅀􅅀􅅀􅄲􅅀􅄲終凶元吉不克食舊不克不永訟德訟所事訟之成卦乾以健而在上坎以險而在下險而健訟之象也蓋天下惟剛而險者為能訟亦必剛而健可以主其訟也九五剛健中正其為訟之主歟然訟之六爻有剛有柔初與三柔居陽位雖可以訟而不至于訟二與四之隂位而居之以剛德故已訟而不克訟惟上九處訟之極剛而不反決于求勝是以終凶也蓋必九五以中正主之如虞舜之訟獄皆歸文王之虞芮質成是不特可以息天下之訟亦可以使無訟也訟有孚窒惕中吉終凶利見大人彖曰訟上剛下險險而健訟訟有孚窒惕中吉剛來而得中也終凶訟不可成也利見大人尚中正也不利涉大川入于淵也訟之所主者孚也乾以剛臨下坎以險遇上險而健所以為訟也何以言有孚卦自遁來以九三之剛易六二之柔而居下卦之中其中剛實為有孚然上下二隂陷之未免窒而不通坎為加憂為心病所以惕而知懼中吉者九二剛來有得中之義終凶者上九過剛而有不可成之義利見大人者以九五陽剛得位而尚乎中正不利涉大川者以三陽乘坎險極而益深然訟之與需皆因坎而生故皆言涉大川而需卦則利訟卦不利者需以健往而出于險訟以健來而陷于險此吉凶之所由以異亦所以見訟之不可長也象曰天與水違行訟君子以作事謀始天之與水其始未嘗違行也記于仲冬之月言水泉動蓋坎為陽水一陽之氣濳行于萬物之表髙下升降脈絡無間見于地行者水之餘耳是以水在天下相違而為訟君子知違行者為訟則當求其始之不違行者事親敬長待人接物皆有本然之天理順理而動謀始之謂也初六不永所事小有言終吉象曰不永所事訟不可長也雖小有言其辨明也初在下體之下去乾剛為尚逺入坎險為未深以隂柔處之不能為訟故爻辭不言訟而言不永所事永長也言其訟不可長也雖初與四相應失位故小有言四體互離雖小有言而其辨明因其始而知其終故曰終吉九二不克訟歸而逋其邑人三百户無眚象曰不克訟歸逋竄也自下訟上患至掇也周禮大司馬注眚字曰猶人眚瘦也王霸記曰四面削其地訟之二五君臣之位也臣無訟君之理惟五與二兩剛不相應故謂之訟使其不知自反則自下訟上其患自取如手取物之掇乃患之所必至者惟得中處柔是以彖曰剛來而得中雖訟而不克訟歸而逋可也其邑人三百户無眚者二正居臣位有食采之邑以周室班爵祿推之大國之君其祿為三百二十夫次國之君其祿為二百四十夫又天子之卿受地視侯大夫受地視伯舉其成數則曰三百戶方其歸而退聽也曰逋曰竄皆有自省知懼之意是以無眚言不削奪其邑而可以長保其富也至此則知象所謂患至掇者非九二得中之事蓋所以為兩剛不相應之戒特因九二以發其義當于其不克訟之旨而深思焉六三食舊德貞厲終吉或從王事無成象曰食舊德從上吉也三不言訟無訟也隂居陽位宜食于舊德而已遊氏謂舊德為世祿以二之邑戶推之則世祿為可知祿不可私稱德而授食其舊德何訟之有然坎險之極乘承皆剛所處不安雖貞而厲惟以正應從上所以終吉或從王事無成者三從上之王事而上九好訟三不敢成其事惟相應而同比于五亦終吉之義也耳九四不克訟復即命渝安貞吉象曰復即命渝安貞不失也即就也渝變也命者天理之正也訟上為方命則從應為即命方命為逆則即命為復四與二皆以剛居柔位故皆言不克訟然二五兩剛不相應惟能窒惕中吉是以無眚此與初雖相應而失位固不免于小有言四為辨明知其不義而復即正理變其不正而安于守正言不失者即命而變不失正理所以貞吉也九五訟元吉象曰訟元吉以中正也九五非為訟者也而爻言訟者謂九五以中正主天下之訟而已合諸爻而論初三以隂居陽位皆不為訟二四以陽居隂位皆不克訟上九好訟或至三禠之惟九五以中正主其訟懲惡勸善悉歸中正所以為元吉也上九或錫之鞶帶終朝三褫之象曰以訟受服亦不足敬也鞶大帶也命服之錫也服以德授則天下莫不敬其德敬由內心以生者也上九陽剛太過居訟之終是謂終凶何有于德而至于以訟受服乎以內卦邑戶食舊德推之必無位而爭爵邑者上居外卦之外貴而無位爭爵為可知如忽突以兄弟而爭蒯瞶輒以父子而爭訟而或勝以至受服初非德授何足敬也况未必勝乎故或之或者未必勝之辭縱使勝之必有終朝三褫之辱信乎訟之不可終也師坤上坎下􅄲􅄲􅄲􅄲􅅀􅄲君命三錫左次弟子長子師出師之成卦坤在上為衆坎在下為律以律制衆師之象也師以九二為主陽剛在下卦之中其主將之任乎是以初之以律出師見可而進者也四之左次無咎知難而退者也上之承家開國皆九二之事所以言在師中吉若夫柔居陽位輕進敗事者六三而已必有六五中順之君為之進退取舍焉長子如九二則命之弟子如六三則舍之夫善將兵者固王將之事而善將將者實大君之事也師貞丈人吉無咎彖曰師衆也貞正也能以衆正可以王矣剛中而應行險而順以此毒天下而民從之吉又何咎矣彖論丈人之義曰師衆也貞正也王者之道本乎正能以正用衆而後可以當丈人之事也丈無他義蓋取乎分寸尺丈之丈五度至于丈則分寸尺之所積其數為始定蓋下卦坎體爾雅曰坎律銓也兵法也生度此法度之所取正者惟九二以丈人主此法度是以剛中而應行險而順乃王者仁義之師而九二以法度用之非能以衆正者乎如攻疾然雖曰毒之乃所以生之也民説而從為王孰禦之此吉且無咎之義也象曰地中有水師君子以容民畜衆地中有水伏而不見遇險即出乃寓兵于農之象農民也兵衆也坤為衆之象坎以二隂為民之象容民而後畜衆古者兵農之政蓋見于此初六師出以律否臧凶象曰師出以律失律凶也朝古易曰否字先儒多作不初六師之始也古者用師之道師出以律而戒乎失律如楚之亂次齊之散亂吳之爭舍晉之爭舟皆失律之師失律為不臧不臧所以為凶出師之初即以凶為戒則知王者不輕于用師如此也九二在師中吉無咎王三錫命象曰在師中吉承天寵也王三錫命懷萬邦也二爻之正位也以九居之而後可以任閫外之權上應六五之君則奉君而出師非承天寵而何五二皆得其中故言在師中吉無咎曰王三錫命懷萬邦者觀上六小人必亂邦之戒則知二之懷萬邦者必非小人僥幸以求勝之舉惟九二以長子帥師則以懷萬邦為主此有征無戰王者之師也六三師或輿尸凶象曰師或輿尸大無功也三以隂居陽位志剛而體柔本不可以帥師故或之言人君或委而任焉則貪進敗事輿尸之象也徂徠石氏謂尸為主輿然經之言輿者如小畜之輿説輹大畜之間輿衛剝言君子得輿之類皆不以衆取義朱文公曰師徒敗撓輿尸而歸故三之大無功視二之在師中吉為有間爻辭又於五六發其義曰長子帥師弟子輿尸二者正安危存亡之機不可不謹所擇此二之所以為吉三之所以為凶也六四師左次無咎象曰左次無咎未失常也六四重隂也居坤體之下坤隂以靜退為主故曰師左次傳以師宿為次次則止而不進是已軍事進則尚右退則尚左夫二以中道行師左之右之皆進退之常至四之時知其不可進而量敵慮勝為之左次以退為進何失常之有此其義所以為無咎也六五田有禽利執言無咎長子帥師弟子輿尸貞凶象曰長子帥師以中行也弟子輿尸使不當也六五用將之主也柔順得中不為兵端不得已而應之田有禽之象禽之害稼去其害而已用師之道執其罪而聲言于衆故曰利執言無咎然柔順之主用師固主于不暴任將或疑于不決曰長子帥師以中行者謂九二之剛中也弟子輿尸使不當者謂六三之失位也蓋二互三四震體震以初爻為長子則次爻為弟子長子受任弟子失位亦在乎五之所擇然弟子輿尸而下復繼之以貞凶者師貞以丈人為吉丈人專主法度使小人參之雖貞亦凶矣聖人申六三之爻辭而一再言之所望于用將者甚切也上六大君有命開國承家小人勿用象曰大君有命以正功也小人勿用以亂邦也上六師之成也凡用師之道師出則嚴其律於始師休則正其功於終小人無自而入焉小人之所由以入者常自不以律始惟不以律始故小人行險僥幸以求勝師休之日將録其一勝之功命之開國承家則亂自此階非王者保治之道論功行賞而獨以小人必亂邦為言必之一辭致戒于小人尤切也比坎上坤下􅄲􅅀􅄲􅄲􅄲􅄲無首顯比外比匪人比自有內孚比之成卦坤上坎下卦以九五一陽為比之主而五爻皆隂類不論其應否而專以比五為主故五之得位陽剛中正有下臨諸侯之象至餘爻分位如五等列爵有上朝天子之象二之藴德于內以正應比五初之誠信質實自他而比五四之親賢從上以近而比五皆有獲吉之道至若三之隂柔不正所比匪人未免有傷也上之無終後而不比其凶為尤甚耳惟九五得所比之道至於上下皆得其應此比道之善者也比吉原筮元永貞無咎不寧方來後夫凶彖曰比吉也比輔也下順從也原筮元永貞無咎以剛中也不寧方來上下應也後夫凶其道窮也比之言吉者蓋一陽為五隂所比比者輔也先王封建萬國如輔車之𫝑得下之順以從而已筮者決也原者再也九五在上再筮以自審其德元有善之意永有久之意貞有固而不變之意能有此三者然後為比之主可以無咎矣而五居尊位猶在坎險不敢以自安故言不寧方來不寧與建侯不寧之義方來與朱紱方來之文相同其心不寧方且來比于下而後在下者無不比乎上夫上六居比之極乃獨後乎五有凶而窮之道凡易言窮者窮則能變所以卦言比吉也象曰地上有水比先王以建萬國親諸侯地上有水密比無間五王也餘爻諸侯也坤在下國也晉畢萬卜事遇屯之比則曰坤土動于下是為有國今坎水在上為衆乃衆建其國之象建萬國則有以比乎國親諸侯則有以比乎王建之而後親之密比無間之道也初六有孚比之無咎有孚盈缶終來有他吉象曰比之初六有他吉也居比之初未與物交有誠信之道焉故言有孚比之無咎然去五最遠未易遽比故再言有孚盈缶缶者質也盈者實也質而且實則誠信素積于中可以上比于五五亦自上比下故曰來非所應而應焉故曰有他吉六二比之自內貞吉象曰比之自內不自失也比之為道皆以衆隂比陽為貴如初之有他吉四之外比貞吉皆以求比而後濟其有不求而自比者惟六二得中應五比之自內初未嘗躁求于外而知所謂不自失之道以正而比所以貞吉也豈他比之可同哉六三比之匪人象曰比之匪人不亦傷乎三隂柔不正去五甚遠而上比于四下比于二介乎隂柔之間故曰比之匪人且二比五于內四比五于外皆有貞吉之道何以謂之匪人以二四言之固以比五為貞以三之一爻言之則上下隂柔非所比之正誠可傷也已六四外比之貞吉象曰外比于賢以從上也易以上卦為外下卦為內而二體亦各有內外四與五同體而言外比亦所以比五也五以陽剛中正為比之主以德則賢也以位則上也四之比賢從上于義為正蓋四與二同義皆柔順得位故二言比之自內四言外比而皆謂貞吉九五顯比王用三驅失前禽邑人不誡吉象曰顯比之吉位正中也舍逆取順失前禽也邑人不誠上使中也五比之主也一陽居中正之位顯比道于天下豈有心于求比者哉譬之從禽設驅逆之車逐禽于圍乃田獵之常今王田不合圍三面而驅順而來則取之初不強其來逆而去則舍之亦不遏其去雖失前禽不顧也盡吾之比而已故以邑人言之邑人從王而田乃已之私屬不待告誡而舍逆取順自然有相比之理以此比天下不特順者來比而逆者亦以不比比之吉孰大焉此無他使之以中而已上六比之無首凶象曰比之無首無所終也乾比既濟未濟皆以上為首比以九五陽剛為主而羣隂皆比上居一卦之極而不能比無首也無首者無所終也以上下言之則為無首以始終言之則為無所終此即卦辭所謂後夫凶深所以為不能比乎陽剛者之戒周易總義卷三
