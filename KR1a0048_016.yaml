body:
  text: 周易總義卷十六宋易祓撰下經巽巽上巽下􅅀􅅀􅄲􅅀􅅀􅄲牀下貞吉悔悔亡亡頻巽牀下進退巽入也卦之上下二體各以一陰伏于二陽之下陽尚決而陰多疑疑則不果于行惟柔而矯之以剛則剛而歸之于中正然後足以盡巽之道巽卦之六爻惟九五爻中正自然貞吉九二爻中而未正與九五爻同德而吉彖之所謂剛巽乎中正者也六四爻比五爻之中正以田獲三品而有功初六爻比乎二爻之中亦進退利武人之貞彖之所謂柔皆順乎剛者也若夫九三爻過乎中而猶近乎正是以頻巽而吝上九爻過乎中而不得其正是以上窮而凶惟剛柔不偏陰陽相濟多疑者以陽剛中正而決君子之善用巽者也巽小亨利有攸往利見大人彖曰重巽以申命剛巽乎巾正而志行柔皆順乎剛是以小亨利有攸往利見大人巽卦之言小亨者二陰之亨也二陰伏乎各體之下多疑不決故謂之巽何以有致亨之理巽風為天之號令在人君則為命必待重巽以申命而後可以言決蓋二爻五爻以剛巽乎中正而其志得行初爻四爻以陰柔而能順乎二五爻之剛剛柔相資是以小亨何謂小亨二爻為臣位之大人五爻為君位之大人而四爻順之此初四爻之陰柔不疑其所行所以利有攸往往則以進見大人為利必于重卦而後見之也象曰隨風巽君子以申命行事風者天之號令也隨風巽者兩風相隨而至申命之義申命欲其決行事者行其號令之事而已觀之觀民設教蠱之振民育德渙之汗其大號姤之施命誥四方非號令之事者乎諸卦得巽體之一端猶足以行事况乎重巽以申命蓋古者之為命也必反復以申其義此事之所以決而無多疑之失也民亦順從者矣初六進退利武人之貞象曰進退志疑也利武人之貞志治也初六爻之言進退者陰居陽位為不正在下卦之下退則無據進則無應欲進欲退猶豫不決其志既亂能無疑乎故必貴乎利武人之貞蓋巽言武人者取其究為躁卦用其躁以為志所以轉疑而為治也凡濟巽之道觀乎人之志而已以利武人之貞為志治則不疑而為決治者謂修立也此進退之所以得其正也九二巽在牀下用史巫紛若吉無咎象曰紛若之吉得中也巽疑卦也九二爻以陽居陰位在巽木下體為牀下之象牀卑于身而身乃下于牀不果于行非疑而何九二爻與初六爻皆以不正自疑初六爻柔而能疑以其能順乎剛故利武人之貞九二爻為陽剛至用史巫紛若則其疑為未釋惟九二得中位與九五爻為配初又順之于下陽與陰比中重于正所以吉而無咎也九三頻巽吝象曰頻巽之吝志窮也九三爻以陽剛得正未為不善惟其正而不中乘剛而行當巽之時其志欲以巽自居本非善于巽乃以互兊之體矯情而為容恱者也是謂頻巽亦猶復卦之六二爻頻復之義相同也復則頻復于善所以厲而無咎巽則頻巽于不善所以其志窮困可吝之甚者也六四悔亡田獲三品象曰田獲三品有功也六四爻在上體之下以陰居柔乘承皆剛冝有悔也惟九二爻九三爻以陽剛上行而六四爻以柔應之且無初六爻之疑是以悔亡往則有功為田獲三品之象也三品者祭祀也賔客也充君之庖也三四五爻互離為田三品為三陽四爻能順乎上下之陽而不為邪諂上比于五下則二三樂為之用故曰田獲三品也九五貞吉悔亡無不利無初有終先庚三日後庚三日吉象曰九五之吉位正中也九五爻與九二爻皆巽卦之中爻也九二爻已中矣猶以不正為疑惟九五爻中正居尊位不疑于所行故曰貞吉悔亡又曰無不利所以決其無所疑也所謂無初有終者重巽以申命故也九五爻出命之主也命之所出亦善其始終而已故以先庚後庚為義庚者始也續也事已而更為之續前事也庚以甲為對甲者事之始故蠱有先甲後甲之説庚者變之始故巽有先庚後庚之説程子易傳謂戊己為中過中為庚曲盡其義九五爻盡所以處庚之道過中則思所以圖其變方其過中未變則謂之無初變而歸于中則謂之有終自始而終皆無所疑即彖之所謂剛巽乎中正而志行者也上九巽在牀下喪其資斧貞凶象曰巽在牀下上窮也喪其資斧正乎凶也上九爻之辭與九二爻之辭同為不正巽之又巽者也故皆為巽在牀下之象也牀在身下而反在牀下過于巽矣九二爻以陽剛得中而所以為吉上九爻剛過于亢在一卦之終以亢而窮窮上必反下亦牀下之義也言牀下則反過于巽是以喪其資斧耳夫資斧者至剛之器上九爻以剛窮反下固已失其陽剛之用已喪其所有而過于巽可謂正乎故于正道為凶也兊兊上兊下􅄲􅅀􅅀􅄲􅅀􅅀引兊孚于商剝兊來兊孚兊和兊兊者説也以重卦而論初爻二爻四爻五爻陽剛在各卦之內者也六三爻上六爻陰柔在各卦之外者也陰柔而在各卦之外兊説之小人而己六三爻居兊説之始下乘二陽爻以為説故初九爻以和兊而信其行九二爻以孚兊而信其志此二陽爻言吉者所以見君子待小人之道也上六爻居兊説之極下引二陽爻以為説故九四爻以介疾為有喜九五爻以孚于剝而厲此二陽爻言疾與厲者所以見君子逺小人之道也三爻上爻之為説一也六三爻以來兊言凶者陰居陽位不得其正上六爻言引兊不言凶者陰居陰位猶近于正惟以利貞為説兊之所以亨也兊亨利貞彖曰兊説也剛中而柔外説以利貞是以順乎天而應乎人説以先民民忘其勞説以犯難民忘其死説之大民勸矣哉兊之為説何也一陰爻進乎二陽爻之上説之見于外者人君之説天下猶兊澤之説萬物説則物情通暢有亨之理説之不以道不説也則容説亦足以害正故利乎貞以卦體推之九二九五陽爻在中則中心誠實之義六三上六陰爻在外則接物謙和之義蓋中心誠實與天為徒故言順乎天接物謙和與人為徒故言應乎人説以利貞天人之所同與也兊之卦自二爻互上爻互澤火為革卦之體革卦之彖辭以順乎天而應乎人為湯武之舉蓋湯武非求説于民者也以利貞之道先乎民而已夫天下之人情莫不欲逸而先王則節其力而不困是以民忘其勞也天下之人情莫不欲安而先王則厚其生而不傷是以民忘其死也説道之大至此至民不期勸而自勸兊之所以為説也象曰麗澤兊君子以朋友講習麗澤兊者上與下皆説故君子以朋友講習魯語有曰學而時習之不亦説乎有朋自逺方來不亦樂乎蓋樂與人同固取乎朋友而説由中以生是以理義之悅我心猶芻豢之悅我口則朋友尤貴乎講習此講習所以貴乎説也初九和兊吉象曰和兊之吉行未疑也兊具少女之性而初九爻在下體之下謙而降己和而得其正者故曰和兊和有二義孔子曰君子和而不同小人同而不和知和而和不以禮節之諂邪而已矣在人安得不疑今以陽剛上行無係應之私而乃勵其剛介自守之行所謂行未疑者不能無疑者也往遇九二爻以剛中相比何疑之有哉所以為吉者也九二孚兊吉悔亡象曰孚兊之吉信志也以九居二爻其位不正又上無正應而近比于陰在兊之時能無悔者乎惟九二爻之陽剛得中為中心誠實孚兊也內有相孚之志則九二之位雖不正而非由于邪佞雖比于陰柔而守志不可移志出于孚則己不疑于人而人亦信其志此孚兊之吉所以悔亡也六三來兊凶象曰來兊之凶位不當也六三爻以陰柔不當位乃下比二陽爻枉道而從之自上而下曰來故言來兊六三爻之上下皆陽爻也陰柔不能尚往而獨安于比下者陰性就下失道以求悅在人則讒諂佞邪側媚以取容者也凶孰大于此焉九四商未寧介疾有喜象曰九四之喜有慶也九四爻比于六三爻而上承乎九五爻承九五者正也比六三者非正也度其可否而審處之則謂之商可否莫知其所從則為商兊未寧未寧則冝何從以陽剛之德介然守正而疾邪于下舍六三而從九五是為介疾有喜喜者喜于從九五爻而獲祐所以有慶也九五孚于剝有厲象曰孚于剝位正當也九五爻兊卦之主何以謂之孚于剝剝者陰剝陽之謂指上六爻也蓋兊為秋三月之卦以六爻分值則上六爻九五爻在九月居剝之位九五爻以陽剛當位而得中能使小人感悅以相孚其何能為吾之剝哉故聖人慮其説比小人則有戒之之辭孚于剝者相與不疑小人或可以容説而進則雖孚而厲亦所以為危道此位之正當危而安者也上六引兊象曰上六引兊未光也上六爻居兊説之極下引二陽爻以説己故為引兊然兊性柔媚彼未遽説而引之使説則凡可為説者無不為己蓋兊之成卦在上六爻與六三爻六三下從二陽故曰來上六引二陽進于上故曰引此非君子之説也故象以引兊為未光二陽何以處之四爻以疾為喜五爻雖孚而厲此君子逺小人之道于兊卦之終見之也渙巽上坎下􅅀􅅀􅄲􅄲􅅀􅄲渙其渙大渙其渙其奔其拯馬血號羣躬機壯渙之成卦巽居上坎居下凡坎在卦之下者未能出險此以巽體在上則險而易散故曰渙渙者散也言足以散天下之險難也故卦內六爻之義惟取乎內外上下之相濟初六爻言用拯馬壯吉則自上而拯者在乎二九二爻言渙奔其機則自下而奔者歸于四六四爻以柔順而輔九五之主合羣心而一之故言渙其羣九五爻以剛中而資六四之臣一天下而作新之故言渙汗其大號若三居下卦之上僅足以渙其躬上居全卦之終僅足以渙其血然三比乎二上比乎五上下內外同心濟險所以六爻無凶咎聖人之善用渙者也渙亨王假有廟利涉大川利貞彖曰渙亨剛來而不窮柔得位乎外而上同王假有廟王乃在中也利涉大川乘木有功也石經彖文利涉大川之下有利貞二字渙卦之所以言亨者陽雖散于外而有剛來不窮之理謂下卦坎中之一陽爻也蓋卦自否變剛自四爻來而為二爻是謂得中而不窮柔自內位乎外而上同是謂上同乎五而亦所以為中此剛柔升降得中之義王假有廟王乃在中者謂九五爻也夫王者中天下而立險難既散則有宗廟之象焦延夀易緯以上爻為宗廟以五爻為天子今王在互艮門闕之上是謂王假有廟又言利涉大川乘木有功者以巽木坎水推之是坎水為川而巽木所以涉川如益卦之言木道乃行中孚卦之言乘木舟虛是出險非難而濟險為難此渙之所以為功也卦辭之言利貞而彖釋卦之德乃不之及言在中有功則利貞之義亦可見矣象曰風行水上渙先王以亨于帝立廟風行水上二物相遇至散而不可摶故言天下之渙者莫加焉當渙之時王乃在中謂之亨帝則一之以郊祀之禮謂之立廟則一之以廟享之禮使天下之出於險難者皆知有所宗主而無渙散之志以天祚之為神明主故也初六用拯馬壯吉象曰初六之吉順也卦中六爻獨初六爻不言渙者渙散之勢救之在始則不至于散然初六之柔順在下其勢不能以獨濟故不言渙而言用拯馬壯渙與明夷二卦皆有此象明夷卦二至四爻為互坎之體而渙卦亦以坎為下體坎為美脊亟心下首薄蹄之馬二卦皆互震在坎體之上馬之健者也今九二爻以馬健在初六爻之上而初六爻處乎九二爻之下乃能以陰柔而順乎二爻二自上拯之以順而行同濟險難故曰用拯馬壯吉也九二渙奔其機悔亡象曰渙奔其機得願也九二爻以陽居陰為失位又陷于坎險若有悔也惟能奮身出險而求安于上故言奔其機蓋機者慿之以為安者也王氏以初六爻為機舊説以九五爻為機漢上朱氏則以六四爻為機推其爻義則上體之巽為木而成卦則六四爻為機之象四爻與二爻互震之體為動故二爻之求安于四爻是謂奔其機四爻亦與之同濟險難而共逹于五得所願者也何悔之有哉六三渙其躬無悔象曰渙其躬志在外也六三爻居坎險之極出險之始未能及人者也止于其躬而已故曰渙其躬蓋卦分三才三爻與四爻則為人位在外體者人也在內體者已也六三爻在內體之上可以出險而與外卦之上九爻為正應上九之渙其血以其去坎險為甚逺是以去逖出險而逺害六三則志在于外亦渙其躬以出險難僅能無悔而已六四渙其羣元吉渙有丘匪夷所思象曰渙其羣元吉光大也六四爻亦人之位而在外卦之下柔得位而上同者也同乎五而已九五爻以剛中而正居君位六四爻以柔順而正居大臣之位以巽順之臣輔剛中之君君臣相須足以成濟天下之功故言渙其羣舉天下而濟之功及乎人其德光大是以元吉也然吉凶之道相為倚伏渙難雖濟勿謂無難若有丘焉三爻四爻五爻互艮卦為山山在艮之下體為丘有丘則不可以為平夷故再言渙而謂之有丘匪夷所思而寧可一日忽乎哉此當于九五爻之居君位言之而特見於六四爻者君與臣同功以濟難其責在六四爻之故也九五渙汗其大號渙王居無咎象曰王居無咎正位也九五爻巽之中體重巽以申命有發號施令之象令出惟行弗惟反汗有弗反之義故言渙汗其大號發大號以濟險惟九五爻之君位剛陽中正乃克有濟然君不主渙而臣主渙六四爻以大臣而有事于險是臣則任其勞而君則享其逸惟端居于上汗其大號而已故曰王居無咎正位也王正位乎上而爻辭止言無咎六四爻輔君于下而爻辭乃言元吉者柔得位而上同君與臣相須元吉而後無咎也非君臣同功合力其能濟乎上九渙其血去逖出無咎象曰渙其血逺害也渙之成卦巽順之體在上坎險之體在下坎為血指六三爻也六三爻既志在外以出險上九爻與之相應而險難不能為害故曰渙其血去逖出與小畜卦之言血去惕出其辭若同而其義不同也惕逖文義自殊當依象辭以渙其血為句去逖出為句逖者逺也謂上九爻去坎險為甚逺故謂之逺害所以為無咎也節坎上兊下􅄲􅅀􅄲􅄲􅅀􅅀苦節草節安莭嗟若不出不出門庭户庭節之成卦兊體居下坎體居上凡人處兊則失于説處坎則失于險惟以中自處而後可以盡節之道考之卦中六爻之義初九爻以兊説之體欲其謹密而不出六四爻以坎險之體欲其安常以承乎上節道之未中者也九二爻雖兊説不出則失時之極九五爻雖坎險往則有功而可尚節道之得其中者也兊體為説而六三爻則過于求説坎體為險而上六爻則過于出險節道之過乎中者也惟節之為道以中為用是以雖説而正雖險而通君子以中道處之此節之所以亨歟節亨苦節不可貞彖曰節亨剛柔分而剛得中苦節不可貞其道窮也説以行險當位以節中正以通天地節而四時成節以制度不傷財不害民節卦之言亨者卦自泰變分九三爻居五之位以節乎上之柔分六五爻居三之位以節乎下之剛剛柔既分而九五爻為主節之君剛得其中夫是以亨然所謂亨者以中為尚以苦為戒古人制行如孝己之孝直躬之直尾生之信申屠狄之潔陳仲子之廉非所謂節之苦者乎苦則失中失中則其道易窮是以不可貞耳今兊説于上而行乎坎之險殆非苦節之所能濟惟九五爻之當位中正無非裁其太過而補其不及非中正以通而何節之為義大矣哉夫天地以是而運行乎四時人君亦以是而立制度于民間此節道之所以通行于萬世而有所不可廢者蓋以此也象曰澤上有水節君子以制度數議德行澤之上有水過乎溢者也過溢則為有餘有餘則冝隄防之乃聖人制節之道夫上卦坎之體為律為度在人則制度數以節乎外下卦兊之體為口為説在人則議德行以節乎內內與外皆有節惟中正者能之卦言中正以通此節道之大者非君子體象能如是乎初九不出户庭無咎象曰不出户庭知通塞也節卦之六爻惟初九爻與六四爻為正應通也可以行也而九二爻以陽剛居其上塞也未可以有行也然兊説之體以陽剛在下其性好動動必不謹惟當靜默以自守故曰不出戶庭也是謂塞而不行不可以為通而謂之知通塞者何夫節者止之義也與艮止同義皆非止之使不進耳酌乎事理之冝然而已故艮之彖則有時止時行之説節之象則有知通塞之説時可以往則出從正應初九爻之塞乃所以為通也九二不出門庭凶象曰不出門庭凶失時極也九二爻與初九爻之不出者一也初九爻在下體之下未可以有行以不出戶庭為冝九二爻得中而上有九五爻之中正以通時可為矣而九五爻非正應乃陽居陰位退守靜默有不出門庭之象三爻至五爻互艮體為門闕九二爻在下為門庭時可為而不能為是謂失時之極極猶凖則失其凖則而謂謹密可以為苟容免過之計此張禹孔光之所以貽禍于天下凶之道也六三不節若則嗟若無咎象曰不節之嗟又誰咎也節卦之六三爻與九五爻相易而成節惟在下體之極已過乎中下乘二剛果能節乎蓋節之六三爻正以體為説説以行險則為節若險而不説則成嗟若嗟與説相反而皆自己為之不出于人故言不節之嗟又誰咎也以六三爻在下體之極極則當變故發此義耳六四安節亨象曰安節之亨承上道也六四爻與初九爻為正應應初爻為安可也今言承上道而以承九五爻為安何也五爻與四爻陰陽相比而相得陽饒而陰乏故陽常以施諸人者為節而陰常以取諸人者為節凡節之為道不相得而強有所取焉皆非所謂安矣雖安亦不能常矣六四爻之所謂安者陰柔在上卦之下上承九五之爻此所以謂之承上道而為安節之亨者也與初九之不出者異矣九五甘節吉往有尚象曰甘節之吉居位中也九五爻節之主也與泰卦之九三爻相易而成九五彖所謂當位而中正者是己惟中正制節于上而通行于天下故言甘節也蓋甘與苦為對苦者炎上之味也甘者中正之味也九五爻之制節如此所以為吉耳往有尚者言中正之道無所不通故也其功豈不大哉上六苦節貞凶悔亡象曰苦節貞凶其道窮也上六爻處節道之極是為苦節與甘節為對知中正以通者為甘節則知制行太峻舉一世無與為徒者為苦節苦節不可貞也貞則不通其道易窮所以為凶耳夫凶大于悔而此反言悔亡者正與大過卦之上六言無咎同意篤于信道所守益固義之所以為悔亡也
