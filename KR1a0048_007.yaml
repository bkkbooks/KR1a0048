body:
  text: 周易總義卷七宋易祓撰上經噬嗑離上震下􅅀􅄲􅅀􅄲􅄲􅅀何校噬乾噬乾噬臘噬肉胏肉膚履校噬嗑之成卦震雷在下離火在上卦本頤體一陽在四之位為頤中之間有噬嗑之象嗑者合也方其未合必貴乎噬考六爻之義有言噬者有不言噬者初爻言履校滅趾則除間之始未至于噬上爻言何校滅耳則除間之終噬有所不足言惟二爻之柔而得中則以噬膚之道噬之三爻之柔而不中則以噬臘肉之道噬之至四爻言噬乾胏則臣道貴乎剛决五爻言噬乾肉則君道貴乎柔恕此二三四五在頤中則言噬初上爻在頤之上下則不言噬而言校六爻之義雖剛柔異體而皆能得所噬之道噬嗑而亨之義也噬嗑亨利用獄彖曰頤中有物曰噬嗑噬嗑而亨剛柔分動而明雷電合而章柔得中而上行雖不當位利用獄也頤中有物噬而後嗑所以言亨蓋卦自否來五以陽剛分而之初初以陰柔分而之五于是成震離之體有動而明之義為雷與電之象電者離也離為火為日為電不取諸火與日而取諸電者電與雷合故也言雷電則向之分者合而章以其卦義推之五爻以柔得中而上行雖不當位利于用獄也然用獄本于治頤中之間上下皆噬者而彖辭獨歸于九五者蓋噬嗑之世噬物或過則其剛易于撓惟五以一隂居尊位而二陽居其上與下則剛柔相濟正柔中上行之義也蓋其位雖不當而利于用獄此噬嗑之所以亨也象曰雷電噬嗑先王以明罰勑法石經作電雷噬嗑噬嗑者所以除頤中之間刑獄者所以除天下之間卦辭言利用獄夫獄者豈常用之具哉蓋罰者刑之輕也法者刑之先也明罰勑法欲使之不犯于刑而已聖人體離之照而明其罰體震之威而勑其法者耳初九履校滅趾無咎象曰履校滅趾不行也初九與上九二爻皆曰校校一也上則言何初則言履以履為校也說者皆言校而不及履尚書大傳曰中刑雜履即傳所謂藨蒯之刑之類是也履者治世之中刑而後世則刑之最輕者何以謂之履校滅趾滅者沒也震體為足在初為趾履校至于滅趾使之不得行而已大傳以小懲大誡為小人之福所以謂之無咎也六二噬膚滅鼻無咎象曰噬膚滅鼻乘剛也以六爻言之五乃除間之主也四乃大臣之除間者也初二三上羣臣之除間者也頤中為間之物四言乾胏者是也六二柔體乃以噬膚之道噬之固未足以得其情惟其乘初爻之剛以初爻之滅趾為不悛又轉而為滅鼻二互三四得艮體為鼻使之褫氣屏息而不得喘是深其刑以治之乃所以懲之也故無咎六三噬臘肉遇毒小吝無咎象曰遇毒位不當也三亦柔體隂居陽位位既不當無乘剛之助當順中有物之時乃以噬臘肉之道噬之臘為小物全乾而不虞胏骨之見傷遂為所毒未免小吝然志在去間噬而必合亦無咎也九四噬乾胏得金矢利艱貞吉象曰利艱貞吉未光也此爻本為間者也一卦全體本頤之象陽剛居四為頤中有物爻言乾胏是已先儒釋乾胏為脯之有骨者其物至剛而難噬二三柔體僅得無咎惟四近君位其體為剛能以噬乾胏之道噬之故言得金矢周官大司寇以東矢聽民之訟以鉤金聽民之獄金堅矢直固足以得其情矣爻言利艱貞而象以為未光者乾胏本至剛之物而又噬之以噬乾胏之道以剛敵剛豈以是為用獄者之光哉處以艱貞是以君子盡心焉諸爻言無咎而四獨言吉者以其同為間之位而終能除其間者也六五噬乾肉得黃金貞厲無咎象曰貞厲無咎得當也六五君位也即彖辭所謂柔得中而上行者是已方其用獄有司既得其情矣以獄之成者告于六五而六五惟柔中故以噬乾肉之道噬之是謂得黃金金者堅而不變也黃者中色也得中不變固可去間何以復言貞厲以六居五其位不當惟先貞後厲是以位雖不當而義得其當此正聖人明謹恤刑之意然言無咎而不言其吉天下未有得當而不吉者蓋用獄之道必噬之而後合此九四爻之吉至此而後為無咎也上九何校滅耳凶象曰何校滅耳聰不明也小人之惡積罪大至上而極何校滅耳謂之耳不聰可也象以為聰不明者明何與于聰哉蓋耳以聽物為聰聽以察為明惟用獄者以之若被罪之人以明用聰則詭計幸免是非貿亂足以惑人之聽惟蔽其聰而使之不明其情既專服其罪而後已此何校滅耳小人凶也賁艮上離下􅅀􅄲􅄲􅅀􅄲􅅀白賁束帛皤如濡如須趾賁之成卦離為下艮為上以六爻比應剛柔相文而已考其爻之義初爻以陽剛應四則言賁其趾不以不義而行也二爻之柔隂比乎上下二陽而五不應焉則言賁其須必有所待而行也三爻雖陽剛無應而比乎上下之二隂故言賁如濡如言必以正而後行也此下三爻離體皆有不進之義矣至上三爻艮體則全以止為義四爻應初比三言賁如皤如則白而不受飾也五爻無正應而比于上言束帛戔戔則白而不過于飾也上爻無正應而比于五言白賁無咎則白而終歸于無所飾也然豈飾哉始則因天下之質而飾之以文終則反天下之文而歸之于質離明艮止之義云耳賁亨小利有攸往彖曰賁亨柔來而文剛故亨分剛上而文柔故小利有攸往天文也文明以止人文也觀乎天文以察時變觀乎人文以化成天下賁之為義離在下為文之盛艮在上為文之節卦本泰體上二爻相易為艮離離之上下二剛得一柔以文其中故曰柔來而文剛艮之二柔在下得一剛以文其上故曰分剛上而文柔則是外卦之上為艮之止故小利有攸往蓋剛柔相錯所以為天文也離明艮止亦所以為人文也奉天理人而任斯文之責者又在乎觀文之主而已惟能觀天文以察四時之變斯能觀人文以成天下之化由是君臣上下之間禮樂教化之際莫不燦然有文以相接豈徒文而遂已哉象曰山下有火賁君子以明庶政無敢折獄山下有火明不及逺所可明者庶政而已是以明其小而不及乎大夫獄者民命所係大政也書言非佞折獄惟良折獄之事庸可忽乎哉是以君子盡心焉則無敢折獄懼其明不及逺而過于察此君子用賁之道也初九賁其趾舍車而徒象曰舍車而徒義弗乘也初在卦之下未交乎上自賁而已故言賁其趾趾者所以行也二三四爻互坎體為車車在前而初載之固足以賁其行則以車為榮剝之上九爻君子得輿是也不可車而車則以車為辱解之六三爻負且乘致寇至是也初比二而應四應四正也從二非正也舍二之易而從四之難義弗克乘則寧舍車而徒自賁在下亦惟其義而已六二賁其須象曰賁其須與上興也下卦離體離之言麗者正在六二蓋二以一柔退處二陽之中有待于上而後行故言賁其須易之言須者皆須待之義也蓋九三之陽剛在上有相賁相濡之象故曰與上興也與上興則剛柔相濟不輕于所麗庸可忽乎九三賁如濡如永貞吉象曰永貞之吉終莫之陵也三以一陽居二隂之間隂陽相文謂之賁如然以陽居陽乂離體炎上為災必待上下二陰而後濟蓋互坎為水有濡如之象然陽剛不中惟待二隂相濡則其勢易以陵象以為終莫之陵者九三剛之正者也六二六四柔之正者也剛柔相比永守其正故曰永貞之吉六四賁如皤如白馬翰如匪寇婚媾象曰六四當位疑也匪寇婚媾終無尤也皤白也六四隂居隂位未獲為賁且艮體為止故言白四互三五爻震體為動在下為左之馬足在上為白顚之的顙白馬也正應在初果于有行是謂白馬翰如九三以互坎阻之故以寇言能無疑乎然九三亦以陽剛上行與初同德與四相比非謂寇而害我乃為婚媾而親我其終比應相賁上承乎六五而無尤于我賁道之善者也六五賁于丘園束帛戔戔吝終吉象曰六五之吉有喜也朱文公易本傳曰戔戔淺小之意今按字義水之小者曰淺貝之小者曰賤賤錢線俴諓皆小貌六五賁之主也宜若人文大備為賁今丘園為野外束帛乃素質戔戔非盛禮則所賁亦小矣何以為六五之象蓋五以柔中在上隂道常乏加以艮體為止用儉為賁其德固以吝而吉象以六五之吉為有喜者隂陽相得為喜六五比六四而六四與離體之九三爻相順而上承乎六五雖吝而能賁此終吉之道也上九白賁無咎象曰白賁無咎上得志也上九分剛而上以離明居止之極蓋飾終反素謂之白賁雜卦言賁無色者是也蓋下三爻言賁四與五則言賁與白至上九則先言白而後言賁則反文而歸之于無色淡汨在上自得其志而超出乎憂患之外是以無咎剝艮上坤下􅅀􅄲􅄲􅄲􅄲􅄲碩果貫魚剝膚剝剝辨剝足剝之成卦坤在下艮在上一陽而為五隂所剝者也夏至一隂為始歷遁否觀至十月建亥而後五隂成剝將有消陽之漸一陽至此其𫝑甚危然天地無終息之機是豈終剝矣乎以六爻考之五陰自下而上初爻言剝以足者隂方來也二爻言剝牀以辨者隂浸長也三爻介乎二四爻之間而止言剝者應乎上九爻之陽也四爻言剝牀以膚者隂之盛將以剝其身也五爻為君位而不言剝者下貫羣隂而比乎上爻也上以一陽居艮止之極而有所不能剝者建戌之月兑氣既終已交西北之乾至十月純坤隂陽相薄是謂龍戰龍戰而勝坤隂不得以用事而剝之上九爻即為復之初九爻五隂之不能剝一陽者其道如此也剝不利有攸往彖曰剝剝也柔變剛也不利有攸往小人長也順而止之觀象也君子尚消息盈虛天行也蓋剝之言剝者上剝字釋卦體也下剝字釋五隂剝陽之義也故曰剝剝也柔變剛也其義則下所以剝上邪所以剝正小人所以剝君子小人道長君子道消也何所往而有利哉所以不利有攸往君子觀象順而止之而已坤順艮止即君子待小人之道也反足則與小人為敵東漢之黨錮是已夫寒暑往來之變其行有序天且不能驟為之而況于人乎夫有息必有消有盈必有虛乃天行之之常君子循乎天行而知消息盈虛之理此一陽雖往而五隂不能剝君子之善用剝者也象曰山附于地剝上以厚下安宅山附于地者言其得所附而不可以終剝也以六爻言之五隂固所以剝一陽論卦之全體則坤為下為厚艮為宅為安下厚則上安上之一陽豈五隂所能剝者哉象辭言上者正謂上九之君子故曰以厚下初六剝牀以足蔑貞凶象曰剝牀以足以滅下也剝者自下而上者六爻皆乾體乾之初爻為姤以成內卦之巽巽為木其象為牀夫牀者身之所安亦君子之所處小人之害君子先去其所處之位初爻之一陽剝于下故言剝牀以足牀足在下則為害尚未深以貞處之猶足以有行惟蔑貞則凶易于剝之初爻蓋其戒之為甚切也六二剝牀以辨蔑貞凶象曰剝牀以辨未有與也剝至于二與三四亦成巽體故言剝牀以辨辨者牀之幹也比牀之足則隂進而上矣如使二之見與于九五而後可以言進惟其未有與也是以剝牀之害已離于足而及于辨然二雖下體亦居中得正其剝未深苟以貞處之亦足以有行惟蔑貞則凶此爻致戒與初同也六三剝之無咎象曰剝之無咎失上下也剝至于三與四五亦成巽體然而不言剝牀者以有上九爻之正應也蓋五爻皆為隂所剝惟上九未至于剝以一陽處羣隂之上而六三爻在羣隂之中失其上與下之隂類而獨與上九爻為正應故易于此爻不言剝牀之象而獨舉其卦名一字謂在剝之道可以無咎蓋咎者過也聖人未嘗絶人以君子之道三爻本羣隂之同類而獨能應乎上爻能補過之君子也六四剝牀以膚凶象曰剝牀以膚切近災也剝至于四正為巽體又離于牀之足與牀之辨而上及牀之膚矣夫至膚則切近于災與足辨不同足辨之患未深惟蔑貞則凶猶有責望之意四則坐以待剝正臨所言八月有凶者無貞可蔑直謂之凶而已幸而六五之君居尊得中不為所剝故象言切近于災而已六五貫魚以宫人寵無不利象曰以宫人寵終無尤也六五獨不言剝者五君位也不當待以剝君子之道而有下制羣隂之義羣隂不可以力勝順而止之而已故曰貫魚以宫人寵宫人隂類也魚亦隂物也以喻小人衆多當剝之時小人駢首而來五能用上九一陽以貫之若貫魚然而皆寵以宫人之寵其待人若過于厚然待之以厚而無與乎威福之柄正順而止之之道此小人安于下而無所尤于君子如是而往無所往而不利者也上九碩果不食君子得輿小人剝廬象曰君子得輿民所載也小人剝廬終不可用也剝上之陽即復初之陽也一陽未復猶在剝上剝極則坤也碩果不食不食則生生則不窮是豈可以終剝也哉以人事言之乃小人道消君子道長之時蓋羣隂為民而下卦坤體為輿上以一陽乘之乃君子得輿之象得輿而為民所載矣則小人亦自剝其廬矣向所謂剝牀之凶者至此而終不可用是知人事無終窮之理即天地無終息之機陽長則隂消造化之自然也復坤上震下􅄲􅄲􅄲􅄲􅄲􅅀迷復敦復獨復頻復休復不逺復復之成卦震下坤上自剝而復乎乾之初也乾至于剝窮上反下一陽生焉所以為天地生物之心在人則為本心幾息而復見之端故六爻皆以人事言之初之不逺復所以為成卦之主二之休復而言下仁者比乎初之仁以求復也三逺于初而言頻復者得補過之道則于義可以無咎也四之獨復而言從道者應乎初之道以求復也五逺于初而言敦復者得坤厚之體則于中可以自考也上居卦極而迷不知復所以為凶是知諸爻皆係乎初故夫子稱顔子以不逺復之辭又告以克已復禮之仁仁果何為哉草木之實謂之仁而生意寓焉復之所以生生不窮者其道蓋如此復亨出入無疾朋來無咎反復其道七日來復利有攸往彖曰復亨剛反動而以順行是以出入無疾朋來無咎反復其道七日來復天行也利有攸往剛長也復其見天地之心乎朱文公易本義剛反為句復之所以言亨者陽剛自剝之上九而反于下者也合卦之二體震動而坤順順者在上動者在下則陽剛可以上行而未可以遽行故言無疾而繼于出入之後入者謂自剝為復出者謂自復而臨于泰惟其有順動之道是以出入無疾而五隂皆順至于臨與泰則衆陽類進故言朋來無咎朋來至泰則陽道盛矣又自大壯而至于乾六乾終焉一隂始生在姤為姤歷遁否觀而至剝則一陽在上反下而為復故曰反復其道凡歷六爻而後為復之初九故又曰七日來復此天行之常君子因剛長之時而順以行之是以無所往而不利且君子小人之進退與隂陽之消長一也然一隂謂之姤者以其來于外而有適然相遇之勢一陽謂之復者以其生于內而為本然自有之物即是而推之陽常主生足以見天地生物之心者矣象曰雷在地中復先王以至日閉關商旅不行后不省方雷在地中則有動而未行之象先王不先時而動故至日閉關商旅不行后不省方靜以待之而已至于朋來無咎則動而順者也初九不逺復無祗悔元吉象曰不逺之復以修身也荀爽九家本以祗為㩼音支廣雅云㩼多也朝古易按祗古文多字初之一陽動于下復其失者也惟其在下其失未逺故曰不逺復如人之失道跬步而復未至甚失是以君子貴乎修身人之一身苟有未善而能修身以復乎善故無祗悔祗多也言無多悔而已惟無多悔進德不已所以大善而吉也六二休復吉象曰休復之吉以下仁也休止也二本震體隂居隂位守柔不動止乎中正故曰休復非無事于復也初之修身在下得克己復禮為仁之道而二比之當復之時二能以已下仁雖止乎中正不求復而自有不容止之理是以休復而獲吉也六三頻復厲無咎象曰頻復之厲義無咎也三以隂居陽不中不正居動之極頻動頻失頻失頻復知復闕者也天下之道二善與不善闕是以復而乂其道甚危使其不能闕其咎何時而已耶聖人開小人遷善之門闕不能改過知所自厲則頻復猶闕善補過者也六四中行獨復象曰中行獨復以從道也闕行乎上下四隂之中而獨能闕復之六四即剝之六三也闕隂而獨應乎闕之中而獨應乎闕六爻之義惟初以陽闕道中行獨復而已六五敦復無悔象曰敦復無悔中以自考也闕人皆以坤體而逺乎陽上逺乎闕故曰敦臨五逺乎陽而能復故曰敦復敦闕之象而六五中位實坤厚之德中以闕仁從道而有間不仁從道則資諸人者闕則得諸已者五以柔中居尊位故能闕自復乎善然去初陽為甚逺未足致闕上六迷復凶有災眚用行師終有大敗以其國君凶至于十年不克征象曰迷復之凶反君道也上居復之極去陽為最逺迷復也蓋復以初之一陽為主五雖去陽為逺中以自考得君之道亦可無悔至上六則極而不反是謂反君之道災眚凶敗固已並至又君道在上惟其迷復則常為小人所以以其國君凶其禍何如哉十為坤數之成至于十年而不克征非能復者也周易總義卷七
