body:
  text: 周易總義卷四宋易祓撰上經小畜巽上乾下􅅀􅅀􅄲􅅀􅅀􅅀既雨有既處孚有孚反目牽復復自道小畜之成卦巽在乾上乾為巽所畜故曰小畜然則巽之隂柔何以畜乾凡乾陽在諸卦之下者皆稱君子今也初九雖與四為應而能復於道九二以剛中自守而乃牽初以復九三近比于四而或至于反目君子在下豈隂柔所能畜者哉惟六四一隂上比二陽資陽剛以行其權是以能畜三陽于下而與之同比于五者考卦辭之義則言密雲不雨陽氣未暢而不能大其施小者畜也小畜亨密雲不雨自我西郊彖曰小畜柔得位而上下應之曰小畜健而巽剛中而志行乃亨密雲不雨尚往也自我西郊施未行也卦之為義以一隂而畜衆陽何也三陽在下欲進于上而畜於六四之一隂四之所畜未宏必資上之二陽以畜之故言上下應之曰小畜健而巽者言健進於下而巽順于上也剛中而志行者言二五皆以剛中合志而行也夫是之謂亨然小畜之亨乃一人之亨而非天下之亨既曰亨矣又曰密雲不雨言隂氣鬱結未可遽進及其上往雖為上九之既雨繼以既處則速止為宜蓋巽體本隂四互兊謂西郊所謂自我西郊而施未行者言固守其隂柔身雖亨而澤不及乎天下小畜之道也象曰風行天上小畜君子以懿文德風行天上起伏聚散著見于物文德之象也小畜以隂柔為主文德未著懿之而已揚雄氏曰浸以光大不亦懿乎懿則美在其中以此畜陽雖未光大畜之不已羣陽為用君子之善用小畜者也初九復自道何其咎吉象曰復自道其義吉也夫自下而上謂之復蓋初九所謂復自道者乾陽本在上之物今乾體居下而初又居乾體之下自下而進復于上乃乾道之常也然受畜於六四之一隂去四為甚逺陽剛上進𫝑有所格未免于咎也惟陽居陽位在下而得其正以道自守雖正應在於四不待於有所畜而能進之復自道其義為吉何咎之有也乎九二牽復吉象曰牽復在中亦不自失也二以陽剛居下卦之中去四尚遠未若初為正應而有進復自道之象惟其與初相比牽初以復故曰牽復然在已不能自復待人而後復未有不徇人而失已者今二以中自守雖非進復自道亦守我之中而不至於自失亦者繼上文之辭九三輿說輻夫妻反目象曰夫妻反目不能正室也陸氏釋文輻作輹許氏說文曰易輿說輹云車軸轉也子夏虞翻傳俱作輹三與初二同為乾體初二受畜而能復者應與比故也三無應於四又不比於初與同類上行而獨逼於六四之一隂未免行而或尼若輿之說輹言三之不能復乎上也何以謂之夫妻反目三以陽居陽位夫之象四以隂居隂位妻之象互離為目隂陽相競為反目三以乾陽上復而四以力止之如反目然是為妻制其夫而夫不能正其室此畜道之至不美者三安能辭其責乎六四有孚血去惕出無咎象曰有孚惕出上合志也四在小畜為一卦之主以巽順居近君之位五亦剛中比之故言有孚君臣相孚畜道之正何以言血去惕出血傷也惕懼也上下固交畜於四而乾惕上往四力止之不能無傷懼如之何四能上孚於五與之合志而衆陽皆順此所以血去惕出而成小畜亨之義是以無咎九五有孚攣如富以其鄰象曰有孚攣如不獨富也五以陽剛中正而下比於四四以有孚感於下五以有孚應于上正畜道之成者是以陽剛之權攣衆陽而畜之故言有孚攣如富以其鄰富陽也不富隂也鄰謂四四隂柔不富而五之陽剛不獨富攣衆陽而富之則天下之富皆歸焉况鄰乎上九既雨既處尚德載婦貞厲月幾望君子征凶象曰既雨既處德積載也君子征凶有所疑也卦辭言密雲不雨隂陽不和之象也上處小畜之極畜道成矣至是則隂陽和而雨惟所畜未大不可或過故既雨而又言既處處止也何謂止小畜以一隂為主則所成之事皆隂事也坤隂以厚德載物所向者德載固可以成小畜之道然婦與月皆隂類婦雖貞而厲月將盈而幾望畜道戒乎虧未免有所疑若不止而猶有征焉雖君子亦凶自既雨至征凶五句而象取首尾句省文也下倣此履乾上兑下􅅀􅅀􅅀􅄲􅅀􅅀視履夬履履虎履虎履尾尾道素履之成卦乾履兌於上而兌以一隂履二陽于下履之象也夫考之六爻履固貴乎剛而亦病夫過於剛二之幽人貞吉四之訴訴終吉上之其旋元吉陽居隂位剛而不過皆有致吉之道也若陽居陽位剛必至於過惟無位僅可無咎蓋五雖中正而亦不免於厲是知剛不可過而况三之隂居陽位又履二陽于下陽剛過暴果可以柔履之乎此六三所以為凶惟以全體論之兌以說而應乎乾剛柔相濟轉凶而吉得所履之正者也此君子之反身修德所以貴乎謹所履也履虎尾不嘻人亨彖曰履柔履剛也說而應乎乾是以履虎尾不嘻人亨剛中正履帝位而不疚光明也履虎尾與遁尾厲既濟未濟之濡其尾皆以初爻取義也履以兌之隂體在下而乾之三陽在上是謂以剛履柔而彖言柔履剛者何也卦惟六三柔體履之主也柔履剛者履在下之二陽而已矣卦兌體兌居西方為虎二陽在下剛而難制若虎尾然履之甚難而三以柔履之其末必有所傷故六三爻辭言履虎尾嘻人凶然兌者說也而上為乾剛所履乃說而能應九四又居乾體之下當兌說之上則向之所謂嘻人者雖剛而不忤雖難制而易服故九四之爻辭亦曰履虎尾訴訴終吉非所謂不嘻人亨者乎况九五之君有剛中正之德剛則所履不息中則所履不過正則所履不變備是三者而後可以安履位而不疚也且居互離之上有光明之美此履道之甚亨者也故尚之象曰上天下澤君子以辨上下定民志履者禮也以上天下澤為象者乾三爻在上則上有常尊兌說在下而應乎乾則下有等威君子以之辨上下則髙卑有定位而足以定民之志此天澤所以為履也初九素履往無咎象曰素履之往獨行願也初之陽剛在下者下無所履未與物交當履之時安其素分故曰素履素履之往獨行願也者君子志願窮則獨善其身無所事乎他求如是而往貧賤富貴無入而不自得是以無咎九二履道坦坦幽人貞吉象曰幽人貞吉中不自亂也二履初為履道居柔守中所履甚安故以坦坦言之然陽剛居兌說之中隂掩之為幽人與歸妹九三同惟幽人靜默中退恬於𫝑利而後可以履道若志於道而又志於𫝑利交戰不决方寸亂矣幽人守以正固而不汨於𫝑利故所履以貞獲吉六三眇能視跛能履履虎尾嘻人凶武人為于大君象曰眇能視不足以有明也跛能履不足以與行也嘻人之凶位不當也武人為于大君志剛也三兌之主也兌為毁折眇跛之象互離為目眇而能視不足以有明也互巽為股跛而能履不足以與行也又其位不當以此履虎尾已不免嘻人之凶况兌體應乾而三乃志於九五之剛故言武人為于大君大君指九五而三互巽體其究為躁故言武人巽卦亦言利武人之貞武人為于大君則以志剛而抗乎五五以光明履帝位而不疚宜其謂夬履而三有所不能抗也九四履虎尾訴訴終吉象曰訴訴終吉志行也四乾之下體也乾位西北而乘西正之兌三居兌上隂柔失位且履二剛於下如履虎尾所以為凶及其說而應乾九四又以陽剛履之陽剛失位亦履虎尾之象然履虎尾同而所履則異四當多懼之地而能以恐懼自處是謂訴訴始雖不獲厥志而乾剛不息終應乎五其志得行即卦辭所謂不嘻人亨宜其終吉也九五夬履貞厲象曰夬履貞厲位不當也夬者决也何以言於履哉履之三上相易其卦為夬夬之所以能决者乾下兌上九五兌體以和用决是能以五陽而决一隂履亦五陽一隂惟兌體應乾而乾之三爻皆以剛决若四若上陽居陽位猶有决而和之意凡五重剛在上其位正當所以獨任夫夬履之責欲决三而去之三之志剛而五不能以和用决必以力勝雖貞亦厲厲者危也然彖言履帝位而不疚初無貶辭者蓋彖言剛中正則發其光明之美爻言夬履貞厲則戒其剛失之過蓋是二者互相為用者也上九視履考祥其旋元吉象曰元吉在上大有慶也上處一卦之極與六三為應視六三所履而考其祥則六三言凶而此以其旋為吉何也旋反也六三應剛而上九應柔故彼之凶反為吾之吉故曰其旋元吉此象所以謂之大有慶大陽也陽與隂為應而隂陽相得所以為慶也泰坤上乾下􅄲􅄲􅄲􅅀􅅀􅅀城復祉元下隍吉際上際尚于征中行吉泰之成卦乾下坤上天地之交也君子在內小人在外天地交之泰也卦辭言小往大來為吉亨而爻辭不純乎吉者何也以人事言之而已初以三陽同類而有彚征之吉二以剛中應五而得中行之尚五以柔中應二而獲元吉之祉泰之所以為泰也三以泰道將革而有無往不復之戒四以泰道將盈而有翩翩不富之戒上以泰道既極而有城復于隍之戒泰之所以不能常泰也惟深察乎隂陽之消長詳辨君子小人之進退以成上下交通之治蓋聖人保泰其道如此泰小往大來吉亨彖曰泰小往大來吉亨則是天地交而萬物通也上下交而其志同也內陽而外隂內健而外順內君子而外小人君子道長小人道消也泰之為言交也卦言小往大來者三隂在外為小往三陽在內為大來以彖辭推之天地交而萬物通上下交而其志同無非乾下坤上之理乾為陽為健其體在內君子之道也坤為隂為順其體在外小人之道也聖人以中道處泰不過使之各得其所處而已君子在內謂之道長則君子無小人之病小人在外謂之道消則小人為君子之歸小往大來並行而不相悖則泰道交而吉且亨矣象曰天地交泰后以財成天地之道輔相天地之宜以左右民泰者天地之交也財成則以天地之道而均以節之輔相則因天地之宜而還以導之以此左右吾民左謂三陽右謂三隂順隂陽之理以遂吾民之生亦天地之所以為泰也初九拔茅茹以其彚征吉象曰拔茅征吉志在外也郭璞洞林讀至彚字絶句否卦初六同初以一陽在下卦之下二陽在上牽連而進拔茅連茹以其彚之象彚類也釋雅者以茹為今之蒨乃茅之類是時也二陽引類上有正應可以行志君子志在于外所以征吉九二包荒用馮河不遐遺朋亡得尚於中行象曰包荒得尚于中行以光大也夫當泰之世二以剛中應五之柔中五資之以治泰者也蓋治泰之道不能使天下皆君子也亦不能使天下皆無小人也以中道先天下而已矣包荒者小人之惡可恕則恕之不必疾之已甚馮河者小人之勇可用則用之不必責之太備不遐遺者小人在外不以疏遠而棄其善朋亡者小人為黨必使之喪朋以趨于善以是四者處泰則小人皆為君子之歸九五之居尊而尚之故曰得尚于中行此所以為光大之盛也九三無平不陂無往不復艱貞無咎勿恤其孚于食有福象曰無往不復天地際也三居乾體之上衆陽至此而競進泰之盛也過此則為六四泰道將革與否為對是為天地之際隂將降于下陽將升于上蓋無有常平而不陂者亦無有常往而不復者一泰一否往來不窮于斯之時厥惟艱哉能思其艱而守之以貞是以無咎然上處泰之極有城復于隍之象且以正應在上而孚于我若苟恤乎上之孚于已也則是相須而趨于否矣惟其勿恤不特無咎而已于食有福乃自求多福之福所以保泰也六四翩翩不富以其鄰不戒以孚象曰翩翩不富皆失實也不戒以孚中心願也四與三介乎泰體之上下正隂陽升降之際三之泰道未革則曰無往不復四之泰道將革則曰翩翩不富以其鄰鄰者謂在下之三陽易以陽為富小畜所謂不獨富是已又以陽為實䝉所謂獨遠實是已今三隂在上皆失實不富而三陽引類欲富乎在上之三隂如鳥之飛翔翩翩然下之以就其鄰得非隂陽相應而孚者夫九二之艱貞在於勿恤其孚而四乃不戒以孚得於中心之所願此陽升隂降之漸保泰君子之所甚畏也六五帝乙歸妹以祉元吉象曰以祉元吉中以行願也五泰之主者也夫泰至三四已有隂陽反復之戒五以得中居尊位不當言隂陽反復故以歸妹明處泰之義蓋泰之五與二皆以中相應是為上下之交二以中德而輔乎君雖剛而有所承五以中德而任其臣雖柔而有所立故六五柔中在上而能謙虛降志以應二故曰帝乙歸妹何言乎帝乙意者帝乙嘗制為禮法使降其尊貴而順從其夫婦人謂嫁曰歸諸侯之尚帝女曰尚此九二所以得尚於中行之主而六五所以有帝乙歸妹之象爻曰以祉元吉象曰中以行願者謂以中道行我志願是以受祉且大善而吉也上六城復于隍勿用師自邑告命貞吝象曰城復于隍其命亂也城復于隍皆坤土之象泰之上體也泰至上九而極其象為城復于隍夫穴土以為隍纍土而髙之以為城亦猶治道積而為泰今也命自上亂亦猶城自上而壞復于隍而後已也當是時也自治不給何以攻人故戒以勿用師若治己邑而告命之守之以貞而益修其自治之道猶不至極亂大壞也故止曰吝而已否乾上坤下􅅀􅅀􅅀􅄲􅄲􅄲傾否休否有命包羞包承貞吉亨否之成卦坤下乾上與泰反體泰則三陽在內三隂在外而有天地交之象否則三隂在內三陽在外而有天地不交之象天下其有終否之理者乎蓋以爻象觀之在否之時初之貞亨二之包承三之包羞下三爻隂體皆以隂之方進而為小人之戒也四之有命五之休否上之傾否三爻乾體皆以陽剛相應而為君子之勸也六爻惟三爻不當位其他曰亨曰吉曰祉曰喜曰無咎何以為否之時哉蓋否泰相因而能反其類以求之自有致吉之理聖人之濟否其道如此否之匪人不利君子貞大往小來彖曰否之匪人不利君子貞大往小來則是天地不交而萬物不通也上下不交而天下無邦也內隂而外陽內柔而外剛內小人而外君子小人道長君子道消也否者泰之反也泰之卦辭曰小往大來吉亨而已否反之則詳著小人之情狀故先言否之匪人不利君子貞而後言大往小來當是之時以天地言之則天地不交而萬物不通以君臣言之則上下不交而天下無邦是以曰隂陽曰剛柔曰君子小人曰道長道消所居之位皆與泰相反否之極也然六爻不言凶悔吝卦辭若不相似者卦言天地之否而爻言濟否之道君子蓋有以處乎此也象曰天地不交否君子以儉德辟難不可榮以祿當否之世小人所以機巧相軋者祿而已惟約己自處以儉德避難不可榮以祿則否之祿為不足勸矣此君子之道所以否而亨初六拔茅茹以其彚貞吉亨象曰拔茅貞吉志在君也否之卦體君子在外小人在內初爻為內卦而不言小人之道何也小人之與君子其初一而已故否泰二卦初爻皆曰拔茅茹以其彚彚者類也泰則二陽在上而引其類其初不可以不進不進則非君子之助否則二隂在上而引其類其初不可以輕進輕進則為小人之歸故否之初爻不言征而言貞何謂貞堅守至正不為同類所引則其初亦為君子之泰是以泰之初九言志在外者從主乎外也否之初六言志在君者專言乎五也而初欲得君以濟否雖居小人之位而有君子之志此所以為吉且亨歟六二包承小人吉大人否亨象曰大人否亨不亂羣也包者容也在否之世二本小人之道而隂柔中正以小人容君子是能降志以相承其可遽絶之哉故爻辭言小人吉而何與乎大人之事大人謂九五五與二為正應而能不亂於小人之羣使小人皆為中正之歸以成休否之功也此小人之吉大人所以為否亨也六三包羞象曰包羞位不當也三小人也隂居陽位不中不正而乃哆然求以蓋其不善之迹有包羞之象所謂羞者怨艾懲創猶足語善若包羞則敢為不善以欺世象以位不當者謂非其人而在髙位惡之之切也九四有命無咎疇離祉象曰有命無咎志行也疇類也離麗也命天命也否泰之理一長一消一往一來循環無窮而有命存焉是以泰之九三否之九四三隂因之而升降故作易者皆為之致其戒九四居上卦之下方與三隂相接小人道長苟不知命而與小人爭角勝負于一决則漢之黨錮其禍有不可勝言者必也九五在上陽剛可以休否以命處之其志得行而輔成濟否之功不特在已無咎而其福均及于同類疇離祉也九五休否大人吉其亡其亡繫于苞桑象曰大人之吉位正當也休止也九五在上未能盡傾其否止其否而已惟陽剛中正乃能自強不息如乾之大人以成休否之功故曰大人吉不然則其否暫止而怠心生矣五互巽為木苞桑之象又巽為繩直繫桑之象大人處此若曰其亡乎其亡乎如以其身係乎方苞之桑曾不能以一朝居栗栗危懼以保終吉是知上九之傾否乃九五之休否者為之也上九傾否先否後喜象曰否終則傾何可長也否泰反其類者也故泰極必否九五陽剛得位成休否之功故上九傾之而不復留此否終則傾何可長也之意如宣王撥亂而天下喜于王化復行久否之餘一遇亨通人情安得不喜蓋喜生於否無否則無喜矣此先否後喜反而為泰也周易總義卷四
