body:
  text: 周易總義卷十四宋易祓撰下經革兑上離下􅄲􅅀􅅀􅅀􅄲􅅀豹變虎變改命三就已日鞏用乃革黃牛革之成卦離在下兊在上澤火相變為革之象革者變也黃帝堯舜氏以來變通不窮皆革之義而彖言湯武革命乃革道之大者初爻不可以有為故言鞏用黃牛伊尹耕莘大公釣渭之時也二爻中正得君可以有為故言已日乃革之伊尹就商太公歸周之時也三爻言三就則升陑孟津之役四爻言改命則南巢牧野之舉五爻言虎變則革夏反商之事爻辭皆言有孚者革而當者也上爻言貞凶居貞吉則都亳都鎬之後濟其革之過者也其他如不相襲禮不相沿樂以至改正朔易服色之類無非通變之道革之貴乎時義者如此革已日乃孚元亨利貞悔亡彖曰革水火相息二女同居其志不相得曰革已日乃孚革而信之文明以説大亨以正革而當其悔乃亡天地革而四時成湯武革命順乎天而應乎人革之時大矣哉革卦之上體兊為澤非水也而彖言水火者火不宜居澤水之下取水火相息之義而已亦兊離二女同居而志不相得之意蓋離火至正秋之兊則為澤水所變故曰革然聖人之有所革于天下不能使人之遽信俟其已日乃孚非革而信者乎以卦彖言之文明以説所以釋革卦上下二體之義也大亨以正所以釋革卦元亨利貞之義也是以宜革而當其悔乃可亡也彖復以天地之成四時湯武之順天應人以推明革之時義知時義之大則知革卦之所以為大者也象曰澤中有火革君子以治厯明時澤中有火者天地革之義也治厯何取乎革日行之度每歲有差堯命羲和厯象日月星辰昴中之時日躔于虛至周已躔于牽牛其後躔于南斗嵗差有法革之而後當所以推明天地革而四時成之大義者也初九鞏用黃牛之革象曰鞏用黃牛不可以有為也革卦之初九爻陽剛未中乃不可以有為之時故戒之以鞏用黃牛之革此皮革也借用其義鞏者固也黃者中色也牛者順物也中順者六二爻之德何以言于初九爻初九用六二之德而不敢以自用故曰鞏鞏則自外而來于內與遁卦之六二爻同辭遁言于下卦之中而革言于下卦之初初則尤不可以有為者也六二已日乃革之征吉無咎象曰已日革之行有嘉也六二爻柔順中正臣道之善者也上應九五爻剛柔相濟于是乎可以言革矣然臣道不可先乎君先乎君則咎所由生故已日乃革之言革之已日者九五爻以正應在上待其巳事之日而往應焉是以行則有嘉蓋君與臣相得往吉自可無咎尤革卦之道至為善者也九三征凶貞厲革言三就有孚象曰革言三就又何之矣九三爻以隂居陽位過中妄動其征必凶其道為至危守以貞固亦為貞厲然離之體在下初爻不可以有為二爻于已日乃革之三爻則革之而就稽之于衆亦云可革故曰革言三就三陽數之老者也上六爻為正應有孚也有孚則革之而當又何之焉言其不可舍是而他有所之已上三爻皆以互乾卦之體為有孚九四悔亡有孚改命吉象曰改命之吉信志也革卦六爻之中惟九四爻不當位宜有悔也而居澤火革之際其動也革而當悔亡矣是以下與初六爻相應上與九五爻相比上下交信為有孚其志既孚于人而後可以言改命改命即革命之義也易之取義不一故不言革而言改九四爻互巽卦之體為命當革卦上下之變則為改命之象也改命于有孚之後上與下信其志所以為吉也九五大人虎變未占有孚象曰大人虎變其文炳也革卦九五爻言大人亦猶乾卦九五爻之言大人也乾卦于五爻有飛龍之象革卦于五爻有虎變之象均是大人也而象則異亦各因其時而已蓋革之上卦兊體兊西方為虎變下與六二爻為應六二居離體之中柔順而文明其文炳然惟革之大人足以當之當革之時固不待占而已為有孚與二爻四爻之有孚異矣上六君子豹變小人革面征凶居貞吉象曰君子豹變其文蔚也小人革面順以從君也上六爻革道之成者也革至于五爻大人虎變其文巳炳然至于上爻則人心從化在君子則下大人一等謂之豹變其文茂密故曰蔚小人則回心向道以正王面故曰面面取乎所向而已君子本與君同向為成文之美小人本與君不同向亦為順從之義當是時也何革為哉若復紛更是謂征凶矣惟能與天下相安而歸乎常所以居貞而吉此持盈守成之爻也哉鼎離上巽下􅅀􅄲􅅀􅅀􅅀􅄲玉鉉黃耳折足耳革有實顛趾鼎之成卦巽居下離居上取象于鼎者也易之諸卦皆言象近取諸物以為象者鼎與井而已井卦以木巽水鼎卦以木巽火二卦皆以飬人為義故皆實象明之今鼎卦之六爻初爻言鼎顛趾則以隂柔在下為足二爻在下卦之中位為鼎有實三爻在下卦之上為鼎耳革四爻應乎下卦之初爻為鼎折足三者皆以陽剛在中為腹五爻言鼎黃耳則以柔居中為耳上爻言鼎玉鉉則以剛柔相節為鉉全體皆具而後足成鼎之用也蓋鼎卦之與井卦其用在五爻而成功皆在上爻井之卦至上六爻而後為元吉鼎之卦至上九爻而後為大吉皆所以全飬人之道以溥利者也鼎元吉亨彖曰鼎象也以木巽火亨飪也聖人亨以享上帝而大亨以飬聖賢巽而耳目聰明柔進而上行得中而應乎剛是以元亨鼎卦繼于革卦之後故初爻利出否否道既革鼎而新之斯謂之元必元吉而後可以言亨物之不亨不知元吉之道者也彖為之推廣其象巽木居離火之下以木巽火也巽下也以木下于火亨飪之象也惟聖人為能極其用亨以享上帝則天道貴乎質故其禮為亨大亨以飬聖賢則人事貴乎文故備其禮而為大亨又上卦離為目五爻為耳下巽巽也自下而上故言巽而耳目聰明蓋卦自巽來柔進而上行于五爻五爻以柔得中而進乎九二爻之剛中君臣以中道相孚而成革故鼎新之功至是而後言元亨則吉亦在其中矣象曰木上有火鼎君子以正位凝命木上有火離與巽成體乃鼎之象也禹之貢金九牧鑄鼎象物三代傳之以為有國者之大寶鎮離體在上位也必有大寶而後可以正離明之位巽體在下命也必有大寶而後可以凝巽申之命至于武王乃遷鼎于雒邑周公遂定鼎于郟鄏皆正位凝命之大旨也初六鼎顛趾利出否得妾以其子無咎象曰鼎顛趾未悖也利出否以從貴也初六爻居卦之下為鼎趾仰而從四爻之正應則趾反居上顛趾之象趾顛則鼎覆咎也于義為悖今象言未悖者何也蓋鼎當致用之始欲取其潔新者必去其穢故者否者故穢之物也利出否以從貴則雖顛趾而末悖易以陽為貴隂為賤初爻之應四爻以賤從貴者也巽在互兊之下為妾三陽爻在前為子長子主器正鼎之象亦子貴賤妾之義又初爻之隂柔妾也顛趾而未悖者也上從四爻之正應子也出否從貴者也是以無咎九二鼎有實我仇有疾不我能即吉象曰鼎有實慎所之也我仇有疾終無尤也九二爻鼎之腹也正應在六五爻易以陽為實隂為虛六五爻隂柔而虛其中九二以陽剛應之則虛者實矣故曰鼎有實然二爻五爻雖正應而二去五尚逺其間必有梗其進者春秋傳曰嘉耦曰妃怨耦曰仇以六五爻言之二爻其嘉耦而三四爻其怨耦歟三四爻以陽剛不中之才見阻于上下交際之間二爻將奈之何哉惟謹其所之不容恱以詭隨亦不輕躁而冒進二爻亦乘剛在上互兊體為毁折是謂我仇有疾不我能即矣其終至於九二爻六五爻自然相應亦無所取于我也乃君臣相得斯謂之吉者歟九三鼎耳革其行塞雉膏不食方雨虧悔終吉象曰鼎耳革失其義也九三爻亦鼎之腹宜有實者也而曰鼎耳革者耳謂六五爻正所謂運鉉而逹其腹之所容者惟上無正應失隂陽相濟之義則鉉塞不行而五之耳無所用力子其間實在其中美如雉膏誰得而享之耶上卦離明為雉膏互兊口在下為不食不食則烏能無悔然君子處已之道要使美實備于我而不計其行之通與塞及其終三爻與二爻以同體順乎五爻隂陽相濟有至和將雨之道此所以虧其始之悔而終以獲吉也九四鼎折足覆公餗其形渥凶象曰覆公餗信如何也九家京荀虞以形為刑以渥為剭重刑也音屋薛云古文作渥九四爻亦鼎之腹宜有實者也其實在二陽之上已過于溢而乃以陽剛之才求應于初爻初爻趾已顛而四爻互兊為毁折故曰鼎折足覆公餗蓋四爻近君位為公之象也公為上所委任信如何也而可以覆餗敗事也宜乎刑之至于渥則其凶可知矣折足可乎哉六五鼎黃耳金鉉利貞象曰鼎黃耳中以為實也六五爻為鼎黃耳黃取中色所以虛中受實為鼎之主然在鼎之上受鉉以舉鼎者乃耳也在鼎之外貫耳以舉鼎者乃鉉也上九爻以剛陽為金鉉而言于六五爻者謂六五爻以中處居無為之地而來上九爻剛實之助也以貞為利君臣相正之義得矣上九鼎玉鉉大吉無不利象曰玉鉉在上剛柔節也上九爻居鼎之極而在趾腹耳之外乃鉉也鉉在鼎之外勇于從五以成運動之功六五以柔中而資上九之陽剛故曰金鉉金鉉者取其剛而已未足以語其德之全也至上爻處一卦之外以剛履柔如玉之剛柔有節故曰玉鉉鉉之為用一而已在上爻為鉉在五爻為金鉉至是而後見其佐五爻以成運動之功然功成矣而不居其功所以大吉而亦無所不利者也震震上震下􅄲􅄲􅅀􅄲􅄲􅅀索索往來遂厲泥蘇蘇來厲虩虩震者動也一陽動乎二隂之下為雷之象合卦之二體則為洊雷震初九爻前震也前震人所駭懼故虩虩九四爻後震也後震人所暇豫故啞啞此前懼後喜之義也六二爻言震來謂前震之來也六五爻言震往謂前震往矣後震復來也二近乎初之震五近乎四之震最近則最危故皆以利言之然二之震言來厲震來虩虩也故喪貝五之震往來厲笑言啞啞也故無喪此先喪後得之義也六三爻去震為逺故言震蘇蘇而無眚上六爻去震亦逺故言震索索而無咎此又玩則招禍恐則致福之義也卦中六爻之義取象洊雷則是恐懼于先而修省于後其用震之道者歟震亨震來虩虩笑言啞啞震驚百里不喪匕鬯彖曰震亨震來虩虩恐致福也笑言啞啞後有則也震驚百里驚逺而懼邇也出可以守宗廟社稷以為祭主也王昭素按徐氏云出字上脫不喪匕鬯四字震卦之所以言亨者初爻與四爻也二爻三爻五爻上爻所震也虩虩者顧慮不安之貌啞啞者笑聲不發之貌震之方來而顧慮不安者乃所以為致福之理此以前震論初爻也震之往來而笑聲莫知所自可以為後之則此以後震論四爻也然四爻之遂泥不如初爻之吉者坤一索于初而後震謂之長男其象為雷雷乃發聲之時初爻有震驚百里之威所以言吉四爻之遂泥者亦初爻之餘威而已驚逺者謂五爻也懼邇者謂二爻也匕鬯謂秬鬯鬱鬯灌地以求神之出皆長子主器之象二爻居中正之位惟以恐懼致福所以喪貝五爻得中而處尊位惟其後之有則所以無喪此不喪匕鬯出則可以守宗廟社稷乃所以發明震亨之義也象曰洊雷震君子以恐懼修省洊者如水洊至習坎之義重也重云者上下皆震故曰洊雷震初爻為前震恐致福也所以貴乎恐懼耳四爻為後震後有則也所以貴乎修省耳然必有取乎洊震者欲君子之恐懼修省不敢一日間斷以自已也初九震來虩虩後笑言啞啞吉象曰震來虩虩恐致福也笑言啞啞後有則也震者長男之卦也以初爻為主故初爻與卦皆言震來虩虩笑言啞啞其詞雖同而其時不同蓋卦以全體言故喜懼同時爻以各體言故前懼後喜以初爻本無啞啞之象于笑言字上獨加後之一字則知後字乃上卦之九四爻特舉九四之啞啞為初爻之虩虩發義自二爻至上爻皆不言吉而初爻之獨以吉稱國本所關以恐懼致福而後遂有則故于初爻發明吉之義也六二震來厲億喪貝躋于九陵勿逐七日得象曰震來厲乘剛也二爻次于初爻乘初爻之剛故言震來厲震方來厲未免喪其所有耳古者寶龜而貨貝貝之為貨人所資者也今喪貝及十萬之數且極其髙逺躋于九陵所喪何其多耶惟二之長男柔順中正能以恐懼自守雖有所喪初不必逐七日可得矣七日者卦中之六爻周而復始故言七日可得以其當于所位故焉耳六三震蘇蘇震行無眚象曰震蘇蘇位不當也三爻逺于初爻者也不若二爻之最近而最恐然二爻以長男居正得中以厲存心喪貝必得三爻不當位故曰蘇蘇言神氣緩散而不伸也當前震之來行以避之僅以旡眚乃怠慢之所自取也九四震遂泥象曰震遂泥未光也九四爻後震也陽剛失位與前震為不同初爻之一陽方來震所以亨今一陽間于上下四隂爻之間且互坎卦為未光其震遂泥而不釋故曰震遂泥泥讀為致逺恐泥之泥以其威極必褻不若初之恐懼致吉也六五震往來厲億無喪有事象曰震往來厲危行也其事在中大無喪也以六居五爻正長子主器之時也五爻與二爻皆震之最近者其得喪亦在乎所處之位而巳二爻以震厲有喪有得五爻往來皆厲何以有得無喪且成天下大有之事蓋居得尊位正所以發明不喪匕鬯出則可以守宗廟社稷以為祭主之義爻言億無喪象言大無喪皆衆多之事此出而主器所以尤貴乎恐懼修省也上六震索索視矍矍征凶震不于其躬于其鄰無咎婚媾有言象曰震索索中未得也雖凶無咎畏鄰戒也上六爻隂柔居震體之極雖比于六五爻之中而志不相得故曰中未得也索索者氣衰而不振之貌矍矍者目動而不安之貌將安之乎所以征凶也然尚逺于四爻非若五爻之鄰于四爻也九四爻之威僅足以及我之鄰而不能及我之躬故曰震不于其躬于其鄰畏鄰戒而恐懼以臨之是以雖凶而無咎然而九四之爻乃陽之爻也上六之爻乃隂之爻也隂與陽兩相配合婚媾之義不能恐懼于震來之始逮乎迫之始知所畏宜其婚媾有言此亦必不能免之者矣艮艮上艮下􅅀􅄲􅄲􅅀􅄲􅄲敦艮輔身限腓趾艮卦以兼山為止不徒止也止有行之理惟其時而已知時之説則知行與止之説聖人觀象設卦而艮以背為主寧非專于止者哉蓋人之身惟背為止專于止則止其所未足以明艮止之義故諸爻皆以動體為象初六爻言艮其止六二爻言艮其腓九三爻言艮其限六四爻言艮其身六五爻言艮其輔至上九爻則言以厚終由爻義推之固以動體為言動而不適乎時則各囿于一偏非艮體之全亦為止其所止惟聖人得乎時止時行之道是以卦中六爻之動隨所感而應之也故曰動靜不失其時其道光明行于其所當行止于其所可止行止皆當乃盡艮之道者也艮其背不獲其身行其庭不見其人無咎彖曰艮止也時止則止時行則行動靜不失其時其道光明艮其止止其所也上下敵應不相與也是以不獲其身行其庭不見其人無咎也朝古易按艮其止只依卦辭作艮其背艮卦以止為義卦之定體也卦辭不過曰無咎而已未足以言聖人之止彖辭始發明艮之之一字謂卦以艮名者時止也蓋天下之理凡可止而不止與夫不當止而止者皆非聖人之時以舜之安汝止言之宜若淡然而無所事者及惟動丕應傒志則出而酬酢萬物之變是為時止則止時行則行動靜不失其時其道光明此行止以時乃聖人之事若言艮其止止其所也上下六位之爻皆敵應而不相與故曰艮其背背者以相背為義如兩人背行則在我不獲其身至于在人則行其庭不見其人此止其所止之義非聖人時止時行之道者也是以不能隨所感而應之惟能有以補其不相與之過使之情通此無咎之謂也象曰兼山艮君子以思不出其位重艮為體兼山之象山以靜為義是以君子思不出其位夫所謂位者凡我所當為而不可過于有所為者皆位也天下之理初非甚髙難行不過君止于仁臣止于敬父子止于慈與孝其諸君子思不出其位者乎然必以思言之思乃出于心憧憧往來何有紀極惟能思不出其位則盡我所當為之理是得其所止者也初六艮其趾無咎利永貞象曰艮其趾未失正也初六爻居卦之下乃足趾之象凡人之行也必先舉趾趾貴乎動而艮止之下動必失正正之于初則不果于有行于正為未失何咎之有也然初六爻柔順未必能固守其正故利在永于貞蓋貞則正固而有常矣是謂得其所止之理此所以致戒于艮之初六爻也六二艮其腓不拯其隨其心不快象曰不拯其隨未退聽也六二爻居艮止之上其象為腓矣腓者足之腹也上與股相依股動則腓隨非能自動者也隨乎三而已何以知其所隨在三爻蓋咸卦之九三爻言執其隨謂股也股居下卦之上剛而不中六二爻能以中正拯之則剛而不病于剛今六二爻以隂柔不能拯三而惟志于隨九三爻亦過剛不中不能退聽于二是以其心不快凡在下位而上無應援乃柔而不立艮其腓之謂也九三艮其限列其夤厲薰心象曰艮其限危薰心也九三上九爻皆成艮之主也上九居一卦之極而無所纍于止以敦艮而止三爻下卦之上上下之際皆接于我而乃能固止其所是謂艮其限列其夤限與夤在人身皆為上下之交列而絶之能無厲乎厲既薰心而象辭復謂之危蓋人心之天未始或忘心既不安其危特甚此三之言危薰心尤有甚于二之心不快也六四艮其身無咎象曰艮其身止諸躬也六四爻巳出下之體而進于上之體在人則為身之象爻言艮其身而象釋之以止諸躬何也躬即身之傴者也亦艮其背之義不言背而言躬躬猶足以見其身與不獲其身者為不同然自其身之傴者言之則見其背而不見其面故象于諸爻之下不言止而于此爻獨言止者亦止諸躬而已豈僅免于咎故曰無咎也六五艮其輔言有序悔亡象曰艮其輔以中正也六五爻居尊位而在衆體之上其位為輔輔頰車也言之所自出也夫君子出其言善則千里之外應之出其言不善則千里之外違之從違之間榮辱係焉能無悔乎五爻惟位乎中正觀其輔之所止而知其出乎言乃有序是以命令皆得其正當此悔所以能亡者也上九敦艮吉象曰敦艮之吉以厚終也上九爻居一卦之極全兼山之體夫山者厚也故曰敦艮蓋敦至上九之爻乃成卦之主艮之終者也天下惟善終者為難耳晚節不移惟厚德者始能之此君子之行其所止非厚德不能以有立也夫人之止難于久終故節或移于晚守或失於終事或廢于久人之所同患也上九能敦厚于終止道之至善所以吉也艮卦之六爻惟此為吉者以其善于守終者也周易總義卷十四
