body:
  text: 周易總義卷九宋易祓撰山經大過兑上巽下􅄲􅅀􅅀􅅀􅅀􅄲女妻士夫棟隆棟橈老夫老婦大過之成卦巽下兑上上下二隂而四陽居中大者過也卦之全體取象于木初為木之本上為木之末本末俱弱故卦言棟橈也而諸爻皆以陽過為義二爻以陽而近于本五爻以陽而近于末乃木之弱者故皆有取于枯楊之象然謂之生梯生華者二以陽居隂而五則過于陽也三爻與四爻乘承皆陽乃木之剛者故皆有取于棟之象謂之棟橈棟隆者四以陽居隂而三則過于陽也然曰隆曰橈與卦言棟橈相反何也卦舉初上二爻言之爻舉三四兩爻言之而過之義則同君子于其過之中而求濟焉大過之所以亨歟大過棟橈利有攸往亨彖曰大過大者過也棟橈本末弱也剛過而中巽而說行利有攸往乃亨大過之時大矣哉大過以陽過為義而初上亦過于隂柔故以本末弱言之本末既弱陽剛之所以為過也此大過所以謂之棟橈蓋棟橈則顛而覆矣乃言利有攸往何耶此以濟過之時言之夫大過之時未嘗有不可支之𫝑而患無以濟過之責今也二五爻雖過于剛而處之以中位巽順于內兑說于外巽而說行則能抑其有餘之陽而濟其不足之隂所以利有攸往而有亨之道也此大過之時所以謂之大也象曰澤滅木大過君子以獨立不懼遁世無悶澤在木上而乃滅木大過也君子體大過之象獨立不懼則所守在我而不可變遁世無悶則舉世不我知而不加損是能以其大過人之德而行濟過之事者也初六藉用白茅無咎象曰藉用白茅柔在下也大過之四陽在上履物者也夫履物為履履于物者為藉初以巽體在下隂柔之才上承四陽故言藉用白茅蓋巽為草為白有白茅之象今初柔而在下不能無咎陽剛大過而以柔藉之則謹畏自持而四陽無所用其剛矣是能補其陽剛之過何咎之有柔之善用也九二枯楊生梯老夫得其女妻無不利象曰老夫女妻過以相與也二爻與五爻言老夫老婦者大過之義也凡物之過乎少壯者皆以老為言說者多以二為老夫初為女妻五為士夫上為老婦獨虞翻以老婦喻初六以女妻喻上六謂巽為長女兑為少女而以大過取義蓋二與五為應而五非其應也過乎五而得于上六五與二為應而二非其應也過乎二而得于初六二者皆過以相與此老夫老婦所以有枯楊之喻然二謂之生梯五謂之生華者何也華者發而將散無所生息所以喻九五爻之過于陽二則不然九二爻雖為老夫而以陽居在卦下體陽過之始過而未及又得上六之士妻故言枯楊生梯梯者顛而復蘖反其始也其榮在下根本甚固誠大異于五之生華而無益于枯者也故曰無不利彖言剛過而中乃亨九二之謂乎九三棟橈凶象曰棟橈之凶不可以有輔也九三言棟橈凶而卦言棟橈亨者何也卦之全體四陽為棟而本末俱弱棟橈之象惟君子有濟過之道所以言亨九三則不然以陽居陽而上承二陽末重本輕剛過于上雖與上為正應而上過于柔弱且居大過之末具能輔之乎象言棟橈之凶不可以有輔無輔于上宜其凶也九四棟隆吉有它吝象曰棟隆之吉不橈乎下也四爻與三爻皆陽也而有棟隆棟橈之異者何耶三以陽居陽上承二陽是為末重本輕與上為正應而過于柔弱故言棟橈而不可以有輔四以陽居隂下履二陽是謂本重末輕剛積于中不橈于下此所以為棟隆之吉然與初為正應而初之柔弱在下不能有濟苟私于從應未免偏係是有它也故戒曰有它吝九五枮楊生華老婦得其士夫無咎無譽象曰枮楊生華何可久也老婦士夫亦可醜也大過之九五得中居尊宜非二之比也然九二爻乃陽剛之始乂得上六之少女為妻故其象為枯楊生梯蓋梯者猶有生息之理五以陽居陽位陽過而極又得初六之老婦婦既老矣無復生息雖得士夫果何益哉故其象為枯楊生華陽剛上行耗蠧之餘無益于枮其能久乎五本喻士夫而言老婦者五與二皆取義于老二有生息之理故先言老夫而繼之以無不利五無生息之理故先言老婦而繼之以無咎無譽而象則以為可醜者亦深戒乎陽剛之不可過者也上六過涉滅頂凶無咎象曰過涉之凶不可咎也上居兑澤之極有過涉之象于是時也險難之𫝑必有奔潰而不可禦者上六隂柔之極勇于濟難以至于滅頂自其身言之所以為凶然殺身成仁亦不可咎此義之所以為無咎也坎坎上坎下􅄲􅅀􅄲􅄲􅅀􅄲過于用險出險出險坎窞有險坎窞坎險也坎之成卦卦之上下二體各以一陽陷于二隂之中其義為兩險相重乃君子習坎之象初爻言入于坎窞則其險在下二爻言求小得則未出乎險三爻言來之坎坎則為重險往來之地下三爻皆受險者也四爻言樽酒簋二則人臣受險之道五爻言不盈既平則人君用險之道上爻言徽纆叢棘則過于用險而及于險上三爻皆治險者也卦體上下皆險而彖言剛中為亨則専指二五兩爻然二何以言未出中五何以言中而未大中無定位以德為本惟五比四為剛柔相濟是以習坎而不陷于險坎之所以亨也習坎有孚維心亨行有尚彖曰習坎重險也水流而不盈行險而不失其信維心亨乃以剛中也行有尚往有功也天險不可升也地險山川丘陵也王公設險以守其國險之時用大矣哉險便習也坎以二隂為險而一陽陷于險中以重險言之其險為益深所以貴乎習故曰習坎重險也重險謂之二體而習不以重取義若取重義則大象言水洊至不當復言習又言君子以常德行習教事亦無重意此王輔嗣所以専有取于便習之說凡重卦皆一字而坎獨加習字使人知重險之可懼習其行險之道而已若禹湯文武數聖人皆未免于險難惟其能重是以能安此聖人憂患以仁天下後世之心至于習坎險而後見也蓋天下之至險莫如水水流而不盈者正所以為險行險而不失其信則三五陽剛中實其德為有孚卦言有孚維心亨而彖以剛中明之剛中其心之謂歟行則有尚謂出險也往則有功謂濟險也如天地有自然之險王公有設險之固險之時何如哉彖復以大言之謂因其所以為難而亦所以為用惟聖人體習坎之義所以能用其大者也象曰水洊至習坎君子以常德行習教事水之洊至為至險故貴乎習坎君子以常德行習教事如政刑之類亦習之以有常之德詩之美宣王者曰有常德以立武事武事即教事之一也而詩人猶以常德為戒此所以修攘復古得習坎之道也君子以之初六習坎入于坎窞凶象曰習坎入坎失道凶也夫一陽陷于二隂之中為坎而初之習坎又居重坎之下故曰入于坎窞又說文謂坎更有坎曰窞言其險為尤深君子處之必有濟險之道所謂道者其有孚維心亨歟初爻以隂柔之才上承陽剛而心不相孚習險所以出險而反陷于坎窞此失道之所以凶者也九二坎有險求小得象曰求小得未出中也夫易之為道陽無求于隂而隂有求于陽是求有益于得者也蒙卦之童䝉求我者是也陽有求于隂是求無益于得者也坎卦之坎有險求小得者是也蓋二陷于險未能出乎險中而欲上求乎九五之陽乃相敵而不相應惟與上下之二隂相比僅足以自振而已是求小有得者也小者謂二隂也二隂非濟險之才者也乃以剛中求之即小有所得果何益于求哉六三來之坎坎險且枕入于坎窞勿用象曰來之坎坎終無功也來退也之進也三爻隂柔不立居下卦之上退而從二既陷于險進而從四復涉于險故曰來之坎坎將奚適哉而乃自以為安險而且枕枕者安也安于不安之地故與初皆入于坎窞然初在下而不能出險三比于四而反陷于深險故戒以勿用用則終于無功也六四樽酒簋二用缶納約自牖終無咎象曰樽酒簋二剛柔際也王注一樽之酒二簋之食瓦缶之器朝氏古易以先讀樽酒簋為一句二用缶為一句則與衆辭不合矣蓋樽以盛酒簋以盛黍稷取坎為酒食之義也當從注八卦重體諸爻皆不相應惟以近比為貴六四以隂居隂而上比于五九五以陽居陽而下比于四四五爻君臣之位而言剛柔際也與解卦之四五爻同義蓋剛柔各當其位而相孚之意自有得于禮文之先者樽酒簋二器皆用缶至于納約信以牖前為禮亦不必堂序行禮之地足以見其質實之至五與四相孚如此其終所以無咎也九五坎不盈祗既平無咎象曰坎不盈中未大也朝古易祗古文多字見復初九九五剛中在上若足濟險而一陽尤陷險中故言坎不盈水不盈科不行故雖中而未大然濟險之責將奚所屬五比于四剛柔有以相濟故又言祗既平祗者多也水多則有通流之漸行則有尚此四五所以言無咎也上六係用徽纆置于叢棘三嵗不得凶象曰上六失道凶三嵗也坎之上與初其位不同而皆謂之失道何也初爻以隂柔居重坎之下處于險而未能出于險上爻以隂柔居重坎之極過于用險而反陷險之內二者失道則一而上為甚蓋九五君位當以道處險而比于六四則剛柔足以相濟不過于用險至于上九則險難已極如係用徽纆置于叢棘無可出之理三爻求應而非其應則不能相援故言三嵗不得也是上爻則有過于初之坎窞矣此初上二爻所以皆言其失道凶也離離上離下􅅀􅄲􅅀􅅀􅄲􅅀出征戚嗟突如日昃黃離履錯離明也離之成卦卦之上下二體各以一隂麗于二陽之中其義為兩明相重乃三代以來人君重明繼世之象初爻言履錯之敬則明之謹于始者二爻言黃離元吉則明之正于中者三爻言日昃之離則明之善于終者下三爻離體前一君之象也四爻言突如其來如則剛躁之害我明者五爻言出涕戚嗟則憂畏而保其明者上爻言出征折首則慎動而用我明者上三爻離體後一君之象也前後皆明是為重明苟繼世之時所麗非正則禍亂實階于此秦隋季世其事亦可為鑑此離之所謂重明要在乎謹所麗而已也離利貞亨畜牝牛吉彖曰離麗也日月麗乎天百穀草木麗乎土重明以麗乎正乃化成天下柔麗乎中正故亨是以畜牝牛吉也離之為麗者明也卦言利貞亨而彖以日月草木百穀釋之既曰重明以麗乎正乃化成天下又曰柔麗乎中正何也夫柔之麗乎中者五爻也柔之麗乎中而正者二爻也二明于始五重于後五得中在上亦欲麗乎六二之中正是知離之成卦所主在二也六二柔順而有牝牛之象蓋人之惡乎柔順者為其邪而已今麗乎中正亦何惡乎柔順也畜者養也養之以中正之道即利貞亨之義此重明之得所麗者然也象曰明兩作離大人以繼明照于四方作如雷雨作解天地解而雷雨作作字為句明兩作離者所以繼明也象之取義不一繼與重異重有前後相重之義繼有始終相繼之義繼明一而已何以言兩作哉大人與日月合其明明之所形有始有終苟或一息之不繼則明有時而或息惟始終相繼之無有間斷所以無逺不照方是大人之明者也初九履錯然敬之無咎象曰履錯之敬以辟咎也離者火也躁而麗于物故于其初者戒之蓋文明之初侈靡紛華錯然于前當是之時出與物接吉凶休咎實係于所履一或不敬咎所必至古之人主惟知履錯之敬而不至輕于所履此避咎之方所以無咎者也六二黃離元吉象曰黃離元吉得中道也二爻與五爻皆以柔得中道柔之麗乎中者五爻也柔之麗乎中而又正者二爻也中正之道惟六二爻能兼之彖言柔麗乎中正故亨是謂黃離蓋六爻中正之爻而黃即中正之色與坤之黃裳同義所以皆謂之元吉象以元吉為得中道者離以中為重之故也九三日昃之離不鼓缶而歌則大耋之嗟凶象曰日昃之離何可久也鄭薜本無凶字朝古易按無凶字得象數九三爻下卦離體之極也夫日過則昃作易者所以致日昃何可久之戒蓋有始有卒者天道之常也當衰暮之年知道者處之如唐堯之明揚側陋周武王之貽謀燕翼安乎常而已矣若夫不鼓缶而歌則大耋之嗟未免有哀樂之相襲非知道者也九四突如其來如焚如死如棄如象曰突如其來如無所容也四已升乎上體而火性炎上逼近六五當重明之始或有害我之明突如其來如如舜之四凶周之四國盛世所不能兔惟六五爻柔中在上麗乎中正不為剛所陵而四則無所容適所以貽自焚之禍以至若燼而死若灰而棄其殘滅有如此者乃剛而犯上之故也六五出涕沱若戚嗟若吉象曰六五之吉離王公也六五以柔中處尊位重明繼世之主也人主繼世之初以代親為憂故言出涕戚嗟取互兑為澤為口之義象言六五之吉離王公者言必若是而後可以麗王公之位在書顧命康王之誥是已若曹丕為嗣而喜見辭色君子以是知魏祚之不昌憂樂之間吉凶判焉此不以位為樂者所以麗正而獲吉也故其宜耳上九王用出征有嘉折首獲匪其醜無咎象曰王用出征以正邦也上九言王而不言公者公無專征之義而出征乃王者之事蓋重明之始以正邦為急有扈之戰商奄淮夷之伐皆人主繼世不得已而征不服有嘉折首則如殱厥渠魁之類獲非其醜則如協從罔治之類不過曰用以正邦而已此上九雖言無咎及其成功則六五之所以為吉者也周易總義卷九
